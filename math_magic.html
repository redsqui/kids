<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2ec4b6">
<title>Матемагия: путешествие в страну чисел</title>
<style>
:root{
  --teal:#22b8a9; --teal-d:#138b80; --teal-l:#d6f6f1;
  --sky:#4aa8f0; --sky-d:#2a83cc; --sky-l:#dcefff;
  --lav:#9b7cf6; --lav-d:#7458e0; --lav-l:#efe9ff;
  --coral:#ff7b6b; --coral-d:#e85a4a; --coral-l:#ffe7e2;
  --sun:#ffc23d; --sun-d:#c98a00; --sun-l:#fff3cf;
  --ink:#243150; --ink2:#55617e; --muted:#7d88a5;
  --card:#ffffff; --line:#e1e7f3; --bg2:#f6f9ff;
  --radius:24px; --radius-s:16px;
  --shadow:0 12px 32px rgba(52,72,130,.13);
  --shadow-s:0 4px 14px rgba(52,72,130,.10);
  --focus:0 0 0 4px rgba(74,168,240,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.9) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 8%, rgba(255,255,255,.9) 0 2px, transparent 3px),
    radial-gradient(circle at 92% 62%, rgba(255,255,255,.8) 0 2px, transparent 3px),
    radial-gradient(circle at 30% 85%, rgba(255,255,255,.8) 0 2px, transparent 3px),
    linear-gradient(165deg,#e2fbf6 0%,#e5f1ff 38%,#efe8ff 72%,#fff3e4 100%);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:var(--focus)}
h1,h2,h3{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- Шапка ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px max(14px,env(safe-area-inset-left));background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(225,231,243,.9)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:6px 8px;border-radius:14px}
.brand .logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--teal),var(--lav));color:#fff;box-shadow:0 4px 10px rgba(155,124,246,.35)}
.brand small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.top-right{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow-s);font-weight:800}
.chip.crystal{background:linear-gradient(135deg,#f3fbff,#efe9ff)}
.chip.crystal b{font-size:18px}
.icon-btn{width:46px;height:46px;border-radius:14px;background:#fff;box-shadow:var(--shadow-s);font-size:20px;display:grid;place-items:center}
.icon-btn[aria-pressed="false"]{opacity:.6}

main{max-width:1140px;margin:0 auto;padding:18px 16px 70px}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,194,61,.0)}50%{box-shadow:0 0 0 10px rgba(255,194,61,.25)}}

/* ---------- Кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:18px;
  font-weight:800;font-size:17px;line-height:1.15;transition:transform .12s ease,filter .2s,box-shadow .2s;user-select:none;text-align:center}
.btn:active:not([disabled]){transform:translateY(2px) scale(.99)}
.btn:hover:not([disabled]){filter:brightness(1.04)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-primary{background:linear-gradient(135deg,#2ec4b6,#22a5d0);color:#fff;box-shadow:0 6px 0 #178c95,0 10px 20px rgba(34,165,208,.25)}
.btn-coral{background:linear-gradient(135deg,#ff8f6b,#ff6b86);color:#fff;box-shadow:0 6px 0 #d4566b,0 10px 20px rgba(255,107,134,.25)}
.btn-sun{background:linear-gradient(135deg,#ffd55e,#ffb238);color:#523600;box-shadow:0 6px 0 #d18f17,0 10px 20px rgba(255,178,56,.25)}
.btn-lav{background:linear-gradient(135deg,#ad92ff,#7f68f0);color:#fff;box-shadow:0 6px 0 #6047c9,0 10px 20px rgba(127,104,240,.25)}
.btn-soft{background:#fff;color:var(--ink);box-shadow:0 4px 0 #dfe5f2,var(--shadow-s)}
.btn-ghost{background:transparent;color:var(--ink2);min-height:44px;padding:8px 14px}
.btn-sm{min-height:42px;padding:8px 14px;font-size:15px;border-radius:14px}
.btn-lg{min-height:62px;font-size:20px;padding:14px 26px;border-radius:22px}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.section-title{font-size:22px;font-weight:800;margin:28px 4px 14px;display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}

/* ---------- Лисёнок ---------- */
.fox-wrap{display:flex;align-items:flex-end;gap:12px}
.fox{width:100px;height:100px;flex:none;filter:drop-shadow(0 8px 10px rgba(255,122,61,.25))}
.fox.lg{width:150px;height:150px}
.fox.sm{width:72px;height:72px}
.fox .fox-star{transform-origin:60px 17px;animation:wiggle 3s ease-in-out infinite}
.fox .fox-tail{transform-origin:80px 88px;animation:wiggle 2.6s ease-in-out infinite}
.fox.happy{animation:bounce .6s ease 2}
.fox.think{animation:wiggle 1.2s ease 1}
.bubble{position:relative;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--shadow-s);font-weight:700;font-size:16px;line-height:1.4;max-width:420px;min-height:52px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble .who{display:block;font-size:12px;color:var(--coral-d);font-weight:800;margin-bottom:2px;letter-spacing:.3px}
.bubble.fresh{animation:pop .35s ease}

/* ---------- Главный экран ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:26px;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.8));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(155,124,246,.25),transparent 70%)}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.5px;
  background:linear-gradient(90deg,#14a99b,#4aa8f0 45%,#9b7cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:clamp(16px,2.4vw,20px);font-weight:700;color:var(--ink2);margin:6px 0 14px}
.hero .btn-row{margin-top:16px}
.hero-fox{display:flex;flex-direction:column;align-items:center}
.hero-fox .fox{animation:floaty 4s ease-in-out infinite}

.map{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:100/52;min-height:330px;
  background:
   radial-gradient(ellipse at 20% 80%, rgba(46,196,182,.35), transparent 45%),
   radial-gradient(ellipse at 80% 20%, rgba(155,124,246,.35), transparent 45%),
   radial-gradient(ellipse at 55% 55%, rgba(255,194,61,.22), transparent 40%),
   linear-gradient(160deg,#bdeee8,#cfe6ff 50%,#e2d8ff)}
.map svg.map-path{position:absolute;inset:0;width:100%;height:100%}
.island{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;text-align:center}
.island .disc{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:#fff;
  box-shadow:0 8px 0 rgba(0,0,0,.08),0 14px 24px rgba(52,72,130,.2);transition:transform .2s}
.island:hover .disc,.island:focus-visible .disc{transform:translateY(-4px) scale(1.05)}
.island .nm{font-weight:800;font-size:15px;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:12px;box-shadow:var(--shadow-s)}
.island .md{font-size:12px;font-weight:700;color:var(--ink2);background:rgba(255,255,255,.75);padding:2px 8px;border-radius:10px}
.island.c1 .disc{background:linear-gradient(135deg,#d7fbe9,#fff)}
.island.c2 .disc{background:linear-gradient(135deg,#dcefff,#fff)}
.island.c3 .disc{background:linear-gradient(135deg,#fff3cf,#fff)}
.island.c4 .disc{background:linear-gradient(135deg,#efe9ff,#fff)}
.island.c5 .disc{background:linear-gradient(135deg,#ffe7e2,#fff)}
.island.c6 .disc{background:linear-gradient(135deg,#ffe0f0,#efe9ff)}
.island.recommended .disc{animation:glow 2s infinite}

.home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:18px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:12px}
.metric{border-radius:18px;padding:14px;background:var(--bg2)}
.metric .v{font-size:28px;font-weight:800}
.metric .l{font-size:13px;font-weight:700;color:var(--ink2)}
.metric.m1{background:var(--teal-l)} .metric.m2{background:var(--sun-l)} .metric.m3{background:var(--sky-l)} .metric.m4{background:var(--lav-l)} .metric.m5{background:var(--coral-l)}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.level-btn{border-radius:16px;padding:12px;background:var(--bg2);text-align:left;border:3px solid transparent;font-weight:700}
.level-btn b{display:block;font-size:16px}
.level-btn span{font-size:12.5px;color:var(--ink2)}
.level-btn[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-l)}
.seg{display:inline-flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:11px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:var(--shadow-s);color:var(--teal-d)}
.row-set{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--teal)}
.quick-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.quick{display:flex;gap:14px;align-items:center;text-align:left;padding:18px;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);transition:transform .2s}
.quick:hover{transform:translateY(-3px)}
.quick .qi{font-size:34px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;flex:none}
.quick b{display:block;font-size:17px}
.quick span{font-size:13.5px;color:var(--ink2);font-weight:600}

/* ---------- Игровой экран ---------- */
.game-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
.game-title{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
.gt-icon{font-size:30px;width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow-s)}
.gt-world{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.gt-name{font-size:21px;font-weight:800}
.lvl-select{min-height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:6px 10px;font-weight:700}
.progress-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.dots i.cur{box-shadow:inset 0 0 0 3px var(--sky)}
.dots i.ok{background:var(--teal);box-shadow:none}
.dots i.help{background:var(--sun);box-shadow:none}
.dots i.shown{background:var(--lav-l);box-shadow:inset 0 0 0 2px var(--lav)}
.timer{flex:1;min-width:160px;height:14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--lav));transition:width 1s linear}
.game-grid{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
.side .bubble::before{display:none}
.side .bubble{max-width:none}
.side .fox{margin:0 auto}
.dragon-box{background:linear-gradient(135deg,#2d2560,#4b3a99);color:#fff;border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.dragon-box svg{width:130px;height:110px}
.dragon-box.hit svg{animation:shake .5s}
.orbs{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:6px}
.orbs i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#c6a8ff 40%,#8a5cf6);box-shadow:0 0 8px #b796ff;transition:all .4s}
.orbs i.gone{background:rgba(255,255,255,.18);box-shadow:none;transform:scale(.7)}
.dragon-box .dl{font-size:13px;font-weight:700;opacity:.9}

.task-card{padding:24px;position:relative}
.task-card.enter{animation:pop .4s ease}
.task-ask{font-size:18px;font-weight:800;color:var(--ink2);margin-bottom:8px;line-height:1.35}
.task-type{display:inline-block;font-size:12px;font-weight:800;color:var(--lav-d);background:var(--lav-l);padding:4px 10px;border-radius:999px;margin-bottom:10px}
.expr{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:clamp(40px,8vw,64px);font-weight:800;margin:14px 0 10px;letter-spacing:.5px}
.expr .op{color:var(--lav)}
.expr .eq{color:var(--muted)}
.expr .num{color:var(--ink)}
.expr .q{color:var(--coral)}
.slot{position:relative}
.ans-input{width:2.6ch;min-width:96px;height:1.35em;text-align:center;font-size:inherit;font-weight:800;border-radius:20px;border:4px dashed #b9c6e6;background:#f7faff;color:var(--teal-d);padding:0 6px;caret-color:var(--coral)}
.ans-input:focus{border-style:solid;border-color:var(--sky);background:#fff;box-shadow:var(--focus)}
.ans-input.ok{border-style:solid;border-color:var(--teal);background:var(--teal-l)}
.ans-input.try{animation:shake .45s}
.ans-input[disabled]{opacity:1;-webkit-text-fill-color:var(--teal-d)}
.answer-zone{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(330px,100%)}
.keypad button{min-height:58px;border-radius:16px;font-size:26px;font-weight:800;background:#fff;box-shadow:0 5px 0 #dfe5f2,var(--shadow-s)}
.keypad button:active{transform:translateY(3px);box-shadow:0 2px 0 #dfe5f2}
.keypad .k-del{background:var(--coral-l);color:var(--coral-d)}
.keypad .k-ok{background:linear-gradient(135deg,#2ec4b6,#22a5d0);color:#fff;box-shadow:0 5px 0 #178c95}
.num-cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.num-card{min-width:72px;min-height:62px;padding:8px 14px;border-radius:16px;font-size:28px;font-weight:800;background:linear-gradient(135deg,#fff7dd,#fff);
  box-shadow:0 5px 0 #f0d58a,var(--shadow-s);cursor:grab;touch-action:manipulation}
.num-card:active{cursor:grabbing}
.drop-hint{font-size:13px;color:var(--muted);font-weight:700}
.slot.drag-over .ans-input{border-color:var(--sun);background:var(--sun-l)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:100%}
.choice{min-height:60px;padding:12px 16px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #dfe5f2,var(--shadow-s);font-size:20px;font-weight:800;text-align:center}
.choice:hover:not([disabled]){background:var(--sky-l)}
.choice.tried{background:#f3f4f8;color:var(--muted);box-shadow:none;text-decoration:line-through}
.choice.right{background:var(--teal-l);box-shadow:0 5px 0 #9fe3d9;color:var(--teal-d)}
.choice .kbd{display:inline-block;font-size:12px;color:var(--muted);margin-right:6px}
.sol-list{display:flex;flex-direction:column;gap:8px;width:100%}
.sol-line{padding:10px 14px;border-radius:14px;background:var(--bg2);font-weight:700;color:var(--ink2);font-size:16px}
.sol-line.pick{background:#fff;box-shadow:0 4px 0 #dfe5f2,var(--shadow-s);font-size:20px;color:var(--ink);text-align:left;min-height:54px}
.sol-line.pick:hover:not([disabled]){background:var(--sun-l)}
.sol-line.ans{background:var(--lav-l);color:var(--lav-d)}
.order-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.order-col h4{margin:0 0 8px;font-size:14px;color:var(--muted)}
.order-list{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:10px;border-radius:18px;background:var(--bg2)}
.order-item{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 14px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #dfe5f2;font-weight:700;font-size:16px;min-height:50px}
.order-item .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sky-l);color:var(--sky-d);flex:none;font-size:14px}
.order-item.placed .n{background:var(--teal);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.tool-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.tool-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:14px;background:var(--bg2);font-weight:800;font-size:14.5px;min-height:44px}
.tool-btn[aria-pressed="true"]{background:var(--lav);color:#fff}
.hint-box{margin-top:16px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#fff8dc,#fffdf3);border:2px solid #ffe08a;font-weight:700;line-height:1.45;animation:pop .35s ease}
.hint-box .hl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sun-d);margin-bottom:4px;font-weight:800}
.hint-dots{display:inline-flex;gap:4px}
.hint-dots i{width:10px;height:10px;border-radius:50%;background:#ffe9a8}
.hint-dots i.on{background:var(--sun)}
.feedback{margin-top:16px}
.fb{padding:16px 18px;border-radius:20px;font-weight:700;line-height:1.45;animation:pop .35s ease}
.fb.ok{background:linear-gradient(135deg,#dbfaf3,#effff9);border:2px solid #9fe3d9}
.fb.try{background:linear-gradient(135deg,#fff1ec,#fffaf6);border:2px solid #ffc9b9}
.fb.shown{background:linear-gradient(135deg,#f1ecff,#faf8ff);border:2px solid #d4c6ff}
.fb .t{font-size:20px;font-weight:800;margin-bottom:4px}
.fb .extra{margin-top:8px;font-size:15px;color:var(--ink2)}
.fb .btn-row{margin-top:12px}
.gain{display:inline-flex;align-items:center;gap:4px;background:#fff;padding:3px 10px;border-radius:999px;font-weight:800;margin-left:6px;box-shadow:var(--shadow-s)}
.tool-panel{margin-top:16px;padding:16px;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);animation:fadeUp .3s ease}
.tool-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tool-head h3{font-size:18px}
.mini-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini{min-height:40px;min-width:46px;padding:6px 10px;border-radius:12px;background:var(--bg2);font-weight:800;font-size:15px}
.mini.p{background:var(--teal-l);color:var(--teal-d)}
.mini.m{background:var(--coral-l);color:var(--coral-d)}
.mini[aria-pressed="true"]{background:var(--sky);color:#fff}
.nl-svg{width:100%;height:auto;display:block;margin-top:6px}
.tool-note{font-weight:700;color:var(--ink2);margin-top:8px;font-size:15px}

/* Мост: визуальные блоки */
.visual{margin:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:10px}
.blocks{display:flex;flex-wrap:wrap;align-items:flex-end;gap:5px;justify-content:center}
.rod{display:grid;grid-template-rows:repeat(10,1fr);gap:2px;width:16px;height:120px;padding:2px;border-radius:6px;background:rgba(0,0,0,.05)}
.rod i,.cube,.frame i{display:block;border-radius:3px}
.rod i{background:var(--teal)}
.rod.lav i{background:var(--lav)}
.rod.coral i{background:var(--coral)}
.cubes{display:grid;grid-template-columns:repeat(5,16px);gap:3px;align-content:end}
.cube{width:16px;height:16px;background:var(--teal)}
.cube.coral{background:var(--coral)} .cube.lav{background:var(--lav)} .cube.sun{background:var(--sun)}
.cube.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--sun)}
.cube.out{background:#e9edf6;box-shadow:inset 0 0 0 2px var(--coral);position:relative}
.cube.pop{animation:pop .3s ease}
.vis-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:center}
.vis-cap{font-size:13px;font-weight:800;color:var(--ink2);text-align:center;margin-top:6px}
.vis-op{font-size:30px;font-weight:800;color:var(--lav);align-self:center}
.frame{display:grid;grid-template-columns:repeat(5,26px);grid-template-rows:repeat(2,26px);gap:4px;padding:6px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.frame i{border-radius:7px;background:#eef2fa}
.frame i.a{background:var(--coral)} .frame i.b{background:var(--teal)}

/* Таблица десятков */
.pv-table{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);margin:8px 0;text-align:center}
.pv-table div{padding:8px;font-weight:800}
.pv-table .h1{background:var(--teal-l);color:var(--teal-d)}
.pv-table .h2{background:var(--sun-l);color:var(--sun-d)}
.pv-table .v{font-size:30px}
.pv-area{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:130px;padding:8px}
.pv-units .cube{background:var(--sun)}
.big-num{font-size:40px;font-weight:800;text-align:center}

/* Сотня */
.hgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:360px;margin:6px auto;padding:6px;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 2px var(--line)}
.hgrid i{aspect-ratio:1;border-radius:4px;background:#eef2fa;font-style:normal;font-size:9px;display:grid;place-items:center;color:#9aa6c4;font-weight:700}
.hgrid i.f{background:var(--teal);color:#fff}
.hgrid i.n{background:var(--sun);color:#6b4b00}
.hgrid i.r{background:var(--lav-l);color:var(--lav-d)}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:13px;font-weight:700;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* Шаги */
.steps-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.steps-tabs button{padding:8px 12px;border-radius:12px;background:var(--bg2);font-weight:800;font-size:14px;min-height:42px}
.steps-tabs button[aria-pressed="true"]{background:var(--lav);color:#fff}
.steps-note{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px}
.step-prev{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.step-prev div{font-size:14px;font-weight:700;color:var(--muted);padding:4px 10px;border-left:3px solid var(--line)}
.step-cur{padding:16px;border-radius:18px;background:linear-gradient(135deg,var(--lav-l),#fbf9ff);animation:pop .3s ease}
.step-cur .sn{font-size:12.5px;font-weight:800;color:var(--lav-d);margin-bottom:4px}
.step-cur .st{font-size:24px;font-weight:800}
.step-cur .st.info{font-size:19px}
.step-cur .stn{font-size:14.5px;color:var(--ink2);font-weight:700;margin-top:6px}
.step-q{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.step-q button{min-width:64px;min-height:48px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #dfe5f2;font-weight:800;font-size:20px}
.step-q button.tried{opacity:.4;text-decoration:line-through}
.step-q .ql{font-weight:800;color:var(--ink2);width:100%;font-size:14px}
.steps-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Семья чисел */
.family{display:flex;justify-content:center}
.family svg{width:220px;height:170px}

/* Результаты, прогресс, библиотека */
.results{text-align:center;max-width:720px;margin:0 auto}
.results .big{font-size:76px;animation:bounce 1.2s ease 2}
.results h2{font-size:30px;margin:6px 0}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tag{padding:7px 12px;border-radius:999px;background:var(--sky-l);font-weight:700;font-size:14px}
.badge-big{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:16px 22px;border-radius:24px;background:linear-gradient(135deg,#fff3cf,#ffe7f4);box-shadow:var(--shadow);animation:pop .6s ease}
.badge-big .bi{font-size:56px}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg2);font-weight:700}
.bar{height:10px;border-radius:999px;background:#e6ebf6;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sky))}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.badge{padding:12px;border-radius:18px;background:var(--bg2);text-align:center}
.badge .bi{font-size:34px}
.badge b{display:block;font-size:14px}
.badge span{font-size:12px;color:var(--ink2);font-weight:600}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge.got{background:linear-gradient(135deg,#fff7dd,#efe9ff)}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tech-card{text-align:left;padding:18px;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .2s;position:relative}
.tech-card:hover{transform:translateY(-3px)}
.tech-card .ti{font-size:34px}
.tech-card b{font-size:18px}
.tech-card .mn{font-size:14px;color:var(--ink2);font-weight:700;font-style:italic}
.tech-card .st{position:absolute;right:14px;top:14px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--bg2);color:var(--muted)}
.tech-card .st.ok{background:var(--teal-l);color:var(--teal-d)}
.tech-detail{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.mnemo{font-size:20px;font-weight:800;padding:14px 18px;border-radius:18px;background:linear-gradient(135deg,#fff3cf,#ffe7e2);margin:10px 0;color:#7a3b00}
.why{padding:12px 16px;border-radius:16px;background:var(--sky-l);font-weight:700;line-height:1.45;margin-top:10px}
.when{padding:12px 16px;border-radius:16px;background:var(--lav-l);font-weight:700;line-height:1.45;margin-top:10px}
.explain{font-size:17px;line-height:1.5;font-weight:600}
.metaphor{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;border-radius:20px;background:var(--bg2);margin-top:12px}
.mini-task{margin-top:14px;padding:16px;border-radius:20px;background:linear-gradient(135deg,#e9fbf7,#f3f8ff)}
.mini-task .mt-expr{font-size:34px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin:8px 0}
.mini-task input{width:110px;height:58px;font-size:30px;text-align:center;font-weight:800;border-radius:16px;border:3px dashed #b9c6e6;background:#fff}
.pairs-board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:560px;margin:14px auto}
.pcard{aspect-ratio:1/1.1;border-radius:20px;font-size:clamp(26px,6vw,40px);font-weight:800;background:#fff;box-shadow:0 6px 0 #dfe5f2,var(--shadow-s);transition:transform .2s,background .2s}
.pcard.sel{background:var(--sky-l);transform:translateY(-4px);box-shadow:0 6px 0 #a9d3f7}
.pcard.done{background:var(--teal-l);color:var(--teal-d);box-shadow:none;transform:scale(.92);opacity:.75}
.pcard.no{animation:shake .4s}

/* Модальное окно, всплывашки, эффекты */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(36,49,80,.45);display:grid;place-items:center;padding:16px;animation:fadeUp .2s ease}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:26px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.modal h2{font-size:22px;margin-bottom:10px}
.modal .btn-row{margin-top:18px;justify-content:flex-end}
.field{margin-top:14px}
.field>label,.field>.lbl{display:block;font-weight:800;margin-bottom:6px}
.toasts{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,92vw)}
.toast{background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 16px 30px rgba(52,72,130,.25);font-weight:800;display:flex;gap:10px;align-items:center;animation:pop .4s ease;width:100%}
.toast .ic{font-size:28px}
.toast small{display:block;font-weight:700;color:var(--ink2)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.fx .gem{position:absolute;font-size:28px}
.fx .conf{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px}
.footer-note{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-top:30px}

/* ---------- Адаптивность ---------- */
@media (max-width:900px){
  .home-grid,.tech-detail{grid-template-columns:1fr}
  .game-grid{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;align-items:center}
  .side .fox{width:72px;height:72px;margin:0}
  .side .bubble{flex:1;font-size:15px}
  .side .dragon-box{display:flex;align-items:center;gap:10px;padding:8px 12px}
  .side .dragon-box svg{width:70px;height:60px}
  .side.has-dragon{flex-wrap:wrap}
  .side.has-dragon .dragon-box{width:100%}
}
@media (max-width:700px){
  main{padding:12px 10px 60px}
  .hero{grid-template-columns:1fr;text-align:center;padding:20px}
  .hero .btn-row{justify-content:center}
  .hero .bubble::before{display:none}
  .hero-fox .fox{width:110px;height:110px}
  .map{aspect-ratio:auto;min-height:0;padding:14px;display:flex;flex-direction:column;gap:10px}
  .map svg.map-path{display:none}
  .island{position:static;transform:none;width:100%;flex-direction:row;gap:12px;background:rgba(255,255,255,.75);border-radius:20px;padding:10px;text-align:left}
  .island .disc{width:62px;height:62px;font-size:30px;flex:none}
  .island .txt{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .island .nm,.island .md{box-shadow:none;background:none;padding:0}
  .task-card{padding:16px}
  .order-wrap{grid-template-columns:1fr}
  .levels{grid-template-columns:1fr 1fr}
  .brand .txt small{display:none}
  .hide-xs{display:none}
  .pairs-board{grid-template-columns:repeat(4,1fr);gap:8px}
  .keypad button{min-height:54px}
}
@media (min-width:701px){ .island .txt{display:contents} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }

<script>
(function(){
'use strict';

/* =====================================================================
   1. УТИЛИТЫ
   ===================================================================== */
function el(tag, props){
  const n = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v; // только статичная разметка приложения (SVG из чисел)
      else if (k === 'style') n.setAttribute('style', v);
      else if (k.slice(0,2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else n.setAttribute(k, v);
    }
  }
  for (let i = 2; i < arguments.length; i++) appendKid(n, arguments[i]);
  return n;
}
function appendKid(n, k){
  if (k == null || k === false) return;
  if (Array.isArray(k)) { k.forEach(x => appendKid(n, x)); return; }
  n.appendChild(typeof k === 'object' ? k : document.createTextNode(String(k)));
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); return n; }
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const chance = p => Math.random() < p;
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function plural(n, one, few, many){ const a=Math.abs(n)%100, b=a%10; if (a>10&&a<20) return many; if (b===1) return one; if (b>=2&&b<=4) return few; return many; }
/* Защита от двойного нажатия */
function onTap(fn, delay){ let last = 0; const d = delay || 380; return function(e){ const t = Date.now(); if (t - last < d) return; last = t; fn.call(this, e); }; }
const COARSE = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

/* =====================================================================
   2. ХРАНИЛИЩЕ И ДАННЫЕ
   ===================================================================== */
function defaultData(){
  return {
    version: 1,
    settings: { sound: true, level: 1, autoLevel: true, op: 'mix' },
    stats: { solved:0, correct:0, firstTry:0, hints:0, fullHints:0, streak:0, bestStreak:0, crystals:0,
             selfSolved:0, persist:0, dragonWins:0, pairsGames:0, byType:{}, byMode:{} },
    tech: {}, learned: [], learnedLog: [], seenTech: [], badges: [], lastMode: null, adapt: []
  };
}
function deepMerge(base, src){
  if (!src || typeof src !== 'object') return base;
  for (const k in src) {
    const v = src[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = deepMerge(base[k], v);
    else if (v !== undefined && (base[k] === undefined || typeof base[k] === typeof v)) base[k] = v;
  }
  return base;
}
const Store = {
  KEY: 'matemagia-progress-v1', available: true,
  init(){ try { localStorage.setItem('__mm_t','1'); localStorage.removeItem('__mm_t'); } catch(e){ this.available = false; } },
  load(){
    let parsed = null;
    if (this.available) { try { const raw = localStorage.getItem(this.KEY); if (raw) parsed = JSON.parse(raw); } catch(e){ parsed = null; } }
    const d = deepMerge(defaultData(), parsed || {});
    d.settings.level = clamp(parseInt(d.settings.level,10)||1, 1, 4);
    if (!['add','sub','mix'].includes(d.settings.op)) d.settings.op = 'mix';
    return d;
  },
  save(d){ if (!this.available) return; try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch(e){ this.available = false; } },
  reset(){ if (this.available) { try { localStorage.removeItem(this.KEY); } catch(e){} } }
};
const App = { data: null };
function save(){ Store.save(App.data); }

/* =====================================================================
   3. МАТЕМАТИЧЕСКОЕ ЯДРО (единое для всех режимов)
   ===================================================================== */
const M = {
  apply: (a,op,b) => op === '+' ? a + b : a - b,
  sym: op => op === '+' ? '+' : '−',
  inv: op => op === '+' ? '-' : '+',
  up10: n => n % 10 === 0 ? n : n + 10 - n % 10,
  down10: n => n - n % 10,
  inRange: n => Number.isInteger(n) && n >= 0 && n <= 100,
  valid(a,op,b){ return this.inRange(a) && this.inRange(b) && this.inRange(this.apply(a,op,b)); },
  /* переход через десяток */
  crosses(a,op,b){ return op === '+' ? (a%10)+(b%10) > 10 : (a%10) < (b%10); },
  /* результат ровно круглый за счёт единиц */
  makesRound(a,op,b){ return b%10 > 0 && (op === '+' ? (a%10)+(b%10) === 10 : (a%10) === (b%10)); },
  expr(a,op,b){ return a + ' ' + this.sym(op) + ' ' + b; }
};

/* ---- Шаги решения ---- */
const info = text => ({ kind:'info', text });
function jump(x,o,y,note){ const r = M.apply(x,o,y); return { kind:'calc', text:`${x} ${M.sym(o)} ${y} = ${r}`, q:`${x} ${M.sym(o)} ${y} = ?`, r, x, o, y, from:x, to:r, label:M.sym(o)+y, chain:true, note:note||'' }; }
function plain(x,o,y,note){ const s = jump(x,o,y,note); s.from = null; s.to = null; s.chain = false; return s; }
function gap(x,y,note){ return { kind:'calc', text:`От ${x} до ${y} — ${y-x}`, q:`От ${x} до ${y} — сколько?`, r:y-x, from:x, to:y, label:'+'+(y-x), chain:false, note:note||'' }; }
function sumOf(parts,note){ const r = parts.reduce((p,c)=>p+c,0); return { kind:'calc', text:`${parts.join(' + ')} = ${r}`, q:`${parts.join(' + ')} = ?`, r, from:null, to:null, chain:false, note:note||'' }; }
function strat(id,tech,name,steps,hint){ return { id, tech, name, steps, hint }; }

const Solver = {
  /* Все корректные способы решения a op b, в порядке удобства */
  strategies(a,op,b){
    const add = op === '+', s = M.sym(op), r = M.apply(a,op,b);
    const ua = a % 10, U = b % 10, T = b - U;
    if (b === 0) return [strat('zero',null,'Ноль не меняет число',
      [info(add ? 'Прибавить 0 — значит ничего не добавить.' : 'Отнять 0 — значит ничего не убрать.'), plain(a,op,0,`Число ${a} не изменилось.`)],
      { q:`Что случится с числом ${a}, если ${add?'прибавить':'отнять'} 0?`, strat:'Ноль ничего не меняет: число остаётся прежним.', split:`Было ${a} кристаллов, ${add?'добавили':'забрали'} 0 кристаллов. Сколько стало?` })];
    if (add && a === 0) return [strat('zeroA',null,'Ноль плюс число',
      [info(`Было 0 — совсем ничего. Добавили ${b}.`), plain(0,'+',b,'Получилось само число.')],
      { q:`Сколько будет, если к пустой корзинке добавить ${b}?`, strat:'Если к нулю прибавить число, получится само это число.', split:`0 + ${b} — это просто ${b} предметов.` })];
    if (!add && a === b) return [strat('same',null,'Число минус само себя',

        [info(`${a} почти ${R}: не хватает ${need}.`), plain(a,'+',need,`Дадим ${need} первому числу.`), plain(b,'-',need,`Заберём ${need} у второго числа.`), info('Сколько дали, столько и забрали — сумма не изменилась.'), jump(R,'+',b2,'Считаем удобную сумму.')],

    let order;
    if (add) order = cross ? (b < 10 ? ['bridge','comp','dbl'] : ['split','bridge','comp','balance','dbl'])

                       : ['drop','units','tensOnly','split','place','bridge','comp'];
    let list = order.map(k => S[k]).filter(Boolean);
    if (!list.length) list = [strat('direct',null,'Посчитаем',[jump(a,op,b)],{ q:`Сколько будет ${M.expr(a,op,b)}?`, strat:'Можно воспользоваться числовой прямой.', split:`Начни с ${a}.` })];
    // контроль: последний шаг каждого способа обязан давать правильный ответ
    return list.filter(st => { const c = st.steps.filter(x => x.kind === 'calc'); return c.length && c[c.length-1].r === r; });
  },
  asJumps(st){
    return Object.assign({}, st, { id:'jumps', tech:'C', name:'Умный прыжок',
      hint: Object.assign({}, st.hint, { strat:'«Десятки — большой прыжок, единицы — маленький».' }) });
  },
  prefer(list, tech){
    if (!tech) return list;
    const i = list.findIndex(x => x.tech === tech);
    if (tech === 'C') {
      const j = list.findIndex(x => x.id === 'split');
      if (j >= 0 && (i < 0 || j < i)) return [this.asJumps(list[j])].concat(list.filter((_,k)=>k!==j));
    }
    if (i > 0) return [list[i]].concat(list.filter((_,k)=>k!==i));
    return list;
  }
};

/* =====================================================================
   4. ГЕНЕРАТОР ЗАДАНИЙ
   ===================================================================== */
const SLOT = { slot: true };
const LEVELS = {
  1: { name:'Начинающий', icon:'🌱', desc:'Без перехода через десяток, небольшие числа' },
  2: { name:'Исследователь', icon:'🧭', desc:'Десятки и единицы, простые переходы' },
  3: { name:'Мастер', icon:'🎓', desc:'Переходы через десяток, круглые числа, неизвестные' },
  4: { name:'Волшебник', icon:'🧙', desc:'Смешанные примеры до 100, проверка и поиск ошибок' }
};
const LEVEL_CFG = {
  1: { aMin:2,  aMax:40,  maxRes:50,  cross:()=>false,                    kind:()=> chance(.75)?'one':'tens' },
  2: { aMin:10, aMax:90,  maxRes:100, cross:()=>chance(.5),               kind:()=> chance(.6)?'one':(chance(.5)?'two':'tens') },
  3: { aMin:11, aMax:99,  maxRes:100, cross:()=>chance(.7),               kind:()=> chance(.75)?'two':'one' },
  4: { aMin:0,  aMax:100, maxRes:100, cross:()=>chance(.5)?undefined:true, kind:()=> chance(.7)?'two':'any' }
};
const FALLBACK = { '+true':[28,7], '+false':[34,5], '-true':[53,6], '-false':[47,3], '+undefined':[36,27], '-undefined':[72,25] };

const Gen = {
  b(kind){
    if (kind === 'one') return rnd(1,9);
    if (kind === 'tens') return rnd(1,6)*10;
    if (kind === 'two') { let v = rnd(11,89); if (v%10 === 0) v += rnd(1,9); return v; }
    return rnd(0,100);
  },
  /* Подбор пары чисел под навык. Цикл ограничен — зависание невозможно. */
  pair(op, level, o){
    o = o || {};
    const cfg = LEVEL_CFG[clamp(level,1,4)];
    let cross = ('cross' in o) ? o.cross : cfg.cross();
    let kind = o.bKind || cfg.kind();
    if (cross === true && kind === 'tens') kind = 'one';
    if (level === 2 && cross === true && !o.bKind) kind = 'one';
    const aMin = o.aMin != null ? o.aMin : cfg.aMin, aMax = o.aMax != null ? o.aMax : cfg.aMax, maxRes = o.maxRes || cfg.maxRes;
    for (let i = 0; i < 500; i++) {
      const a = rnd(aMin, aMax), b = this.b(kind);
      if (!M.valid(a,op,b)) continue;
      const r = M.apply(a,op,b);
      if (r > maxRes) continue;
      if (o.minRes != null && r < o.minRes) continue;
      if (cross === true && !M.crosses(a,op,b)) continue;
      if (cross === false && M.crosses(a,op,b)) continue;
      if (o.test && !o.test(a,b)) continue;
      return [a,b];
    }
    const f = FALLBACK[op + String(cross)] || (op === '+' ? [34,5] : [47,3]);
    return f.slice();
  },
  op(ctx){ return ctx.op(); }
};

function numOptions(ans, n){
  n = n || 4;
  const set = new Set([ans]);
  const sw = (ans >= 10 && ans < 100 && ans%10 !== 0) ? (ans%10)*10 + Math.floor(ans/10) : -1;
  const cands = shuffle([ans+1, ans-1, ans+10, ans-10, ans+2, ans-2, sw, ans+11, ans-9]);
  for (const c of cands) { if (set.size >= n) break; if (M.inRange(c)) set.add(c); }
  for (let k = 3; set.size < n && k < 120; k++) { const c = ans + (chance(.5) ? k : -k); if (M.inRange(c)) set.add(c); }
  return shuffle(Array.from(set));
}
function hintsOf(st){ return [st.hint.q, st.hint.strat, st.hint.split]; }
function lineOf(st, a, op, b){
  const js = st.steps.filter(x => x.kind === 'calc' && x.from != null).map(x => ({ from:x.from, to:x.to, label:x.label }));
  if (!js.length) js.push({ from:a, to:M.apply(a,op,b), label:M.sym(op)+b });
  return { start: js[0].from, jumps: js };
}
function keyOf(a,op,b){
  if (a === 0 || b === 0 || (op === '-' && a === b)) return 'edge';
  if ((op === '-' && a === 100) || (op === '+' && a + b === 100)) return 'hundred';
  if (M.makesRound(a,op,b) || b%10 === 0) return 'round';
  return (op === '+' ? 'add_' : 'sub_') + (M.crosses(a,op,b) ? 'cross' : 'nocross');
}
let TASK_ID = 0;
function choiceTask(o){ return Object.assign({ id:++TASK_ID, kind:'choice' }, o); }

  edge(){

      rel=`Из неизвестного числа отняли ${b} и осталось ${c}. Значит, сначала было ${c} + ${b}.`; q=`Каким было число, если после того, как отняли ${b}, осталось ${c}?`; family={ whole:a, parts:[b,c], unknown:'whole' }; }

  decompose(level){

      { q:`Какая цифра в числе ${n} показывает десятки?`, strat:'В двузначном числе первая цифра — десятки, вторая — единицы.', split:`${tn} ${plural(tn,'десяток','десятка','десятков')} — это ${t}.` });
    if (chance(.55)) {

      opts.add(t >= 20 && u < 9 ? `${t-10} + ${u+1}` : `${t} + ${Math.min(9,u+1) === u ? u-1 : Math.min(9,u+1)}`);

        options:arr.map(x=>({text:`${n} = ${x}`})), answer:arr.indexOf(`${t} + ${u}`), strategies:[st], hints:hintsOf(st),

      view:{ ask: askTens ? `Сколько десятков в числе ${n}?` : `Сколько единиц в числе ${n}?`, big:String(n), expr:[SLOT], label:'Числовой разрез' },
      strategies:[st], hints:hintsOf(st), line:{ start:0, jumps:[{from:0,to:t,label:'+'+t},{from:t,to:n,label:'+'+u}] }, sig:'D'+n+askTens, num:n };
  },
  chooseRound(level){
    const op = chance(.5) ? '+' : '-';
    const p = Gen.pair(op, Math.max(2, level), { cross:true, test:(a)=>a%10>0 });
    const a = p[0], b = p[1], ans = op === '+' ? M.up10(a) : M.down10(a);
    const wrong = op === '+' ? [M.down10(a), ans+10, ans+20, ans-20] : [M.up10(a), ans-10, ans-20, ans+20];

    const arr = shuffle(set);

  order(level){

      const strats = Solver.strategies(p[0], op, p[1]);
      const st = strats.find(x => ['bridge','split','comp'].indexOf(x.id) >= 0);

      return { id:++TASK_ID, type:'order', kind:'order', key:'order', tech:st.tech,
        view:{ ask:`Расставь шаги решения по порядку: ${M.expr(p[0],op,p[1])}`, label:'Конструктор решения' },

  error(level){
    for (let tries = 0; tries < 25; tries++) {
      const op = chance(.5) ? '+' : '-';

      const a = p[0], b = p[1];

      if (!cand.length) continue;

      const calcIdx = st.steps.map((x,i)=>x.kind==='calc'?i:-1).filter(i=>i>=0);
      if (calcIdx.length < 2) continue;

      const deltas = shuffle([10,-10,1,-1,2,-2]);
      for (const delta of deltas) {
        let carry = null, okRange = true;
        const lines = st.steps.map((x,i) => {
          if (x.kind === 'info') return { text:x.text, calc:false };
          const xx = (carry != null && x.chain) ? carry : x.x;
          let r = M.apply(xx, x.o, x.y); if (i === k) r += delta;

          carry = r;
          return { text:`${xx} ${M.sym(x.o)} ${x.y} = ${r}`, calc:true, idx:i };
        });
        if (!okRange) continue;
        const final = carry;
        if (final === M.apply(a,op,b)) continue;
        const calcLines = lines.filter(l => l.calc);
        const wrongPos = calcLines.findIndex(l => l.idx === k);
        const correctText = st.steps[k].text;
        const strategies = [Object.assign({}, st, { steps: st.steps.concat([info(`Ошибка была в шаге «${calcLines[wrongPos].text}». Верно: ${correctText}.`)]) })].concat(strats.filter(x=>x!==st));
        return choiceTask({ type:'error', key:'error', tech:'H',
          view:{ ask:`Ученик решал пример ${M.expr(a,op,b)} и в одном шаге ошибся. Найди ошибочный шаг!`, solution:lines, finalLine:`Ответ ученика: ${final}`, label:'Найди ошибку' },
          options:calcLines.map(l=>({text:l.text})), answer:wrongPos, strategies,
          hints:['Проверь каждую строчку отдельно: посчитай сам и сравни.', 'Пересчитай каждый шаг — можно на числовой прямой.', `Правильный ответ всего примера — ${M.apply(a,op,b)}. Где решение пошло не туда?`],

  verify(level){
    const op = chance(.5) ? '+' : '-';
    const p = Gen.pair(op, Math.max(2, level), { test:(a,b)=>a>0&&b>0 });
    const a = p[0], b = p[1], r = M.apply(a,op,b);

      { q:'Каким действием можно проверить эту запись?', strat:'«Проверь обратным действием»: сложение проверяем вычитанием, а вычитание — сложением.', split:`Посчитай ${shown} ${M.sym(io)} ${b} и сравни с ${a}.` });
    return choiceTask({ type:'verify', key:'verify', tech:'H',
      view:{ ask:'Следопыт проверяет запись. Она верная?', expr:[a, M.sym(op), b, '=', shown], label:'Проверка следопыта' },
      options:[{text:'✔ Верно'},{text:'✘ Есть ошибка'}], answer: good ? 0 : 1,
      strategies:[st].concat(Solver.strategies(a,op,b)), hints:hintsOf(st),

  family(level){
    const p = Gen.pair('+', Math.max(2, level), { test:(a,b)=>a>0&&b>0&&a!==b });

      [info(`Числа ${a}, ${b} и ${c} — одна семья: ${c} — целое, ${a} и ${b} — его части.`), info('Если из целого убрать одну часть, останется другая часть.'), plain(c,'-',sub,'Пересчитывать не нужно — ответ уже есть в семье!')],
      { q:`Какое число — целое в семье ${a}, ${b} и ${c}?`, strat:'«Сложение и вычитание помогают проверять друг друга».', split:`${c} − ${sub}: из целого убираем часть ${sub}. Какая часть останется?` });
    return { id:++TASK_ID, type:'family', kind:'number', key:'family', tech:'F', answer:ans,
      view:{ ask:`Мы знаем: ${a} + ${b} = ${c}. Найди ответ, не считая заново!`, expr:[c,'−',sub,'=',SLOT], family:{ whole:c, parts:[a,b], unknown:null }, showFamily:true, label:'Семья чисел' },
      strategies:[st].concat(Solver.strategies(c,'-',sub)), hints:hintsOf(st), line:{ start:c, jumps:[{from:c,to:ans,label:'−'+sub}] }, sig:'F'+c+'-'+sub };

  whichWorks(level){
    const op = chance(.5) ? '+' : '-';
    const p = Gen.pair(op, 3, { bKind: chance(.7)?'two':'one', test:(a,b)=> b>=8 && b%10>=8 && (op==='+' ? a+M.up10(b)<=100 && a>=5 : a>=M.up10(b) && a-M.up10(b)-(M.up10(b)-b)>=0) });

    const wrongSign = add ? `${a} + ${B} = ${mid}, потом ${mid} + ${e} = ${mid+e}` : `${a} − ${B} = ${mid}, потом ${mid} − ${e} = ${mid-e}`;
    const wrongAmt = add ? `${a} + ${B} = ${mid}, потом ${mid} − ${e+1} = ${mid-e-1}` : `${a} − ${B} = ${mid}, потом ${mid} + ${e+1} = ${mid+e+1}`;

/* Режимы, генерирующие задания по навыкам */

  B: lvl => chance(.3) ? R(() => Tasks.decompose(lvl)) : R(() => { const op = chance(.5)?'+':'-'; const p = Gen.pair(op, 3, { cross:false, bKind:'two' }); return Tasks.arith(p[0],op,p[1],{ tech:'B' }); }),
  C: lvl => R(() => { const op = chance(.5)?'+':'-'; const p = Gen.pair(op, 3, { bKind:'two' }); return Tasks.arith(p[0],op,p[1],{ tech:'C' }); }),
  D: lvl => chance(.5)

    : R(() => Tasks.whichWorks(lvl)),
  H: lvl => R(() => Tasks.verify(lvl)),

const Sound = {
  ctx: null,
  ensure(){
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { this.ctx = new C(); } catch(e){ return null; } }
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch(e){} }
    return this.ctx;
  },
  tone(f, t0, d, type, v){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || .12, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  play(name){
    if (!App.data || !App.data.settings.sound) return;
    const c = this.ensure(); if (!c) return;
    try {
      if (name === 'tap') this.tone(700,0,.05,'triangle',.04);
      else if (name === 'ok') { this.tone(660,0,.12,'sine',.14); this.tone(880,.1,.12,'sine',.14); this.tone(1175,.2,.22,'sine',.12); }
      else if (name === 'oops') { this.tone(392,0,.14,'sine',.08); this.tone(330,.12,.2,'sine',.07); }
      else if (name === 'hint') { this.tone(988,0,.1,'triangle',.07); this.tone(1319,.08,.16,'triangle',.06); }
      else if (name === 'gem') [1047,1319,1568,2093].forEach((f,i)=>this.tone(f,i*.06,.14,'triangle',.07));
      else if (name === 'win') [523,659,784,1047,784,1047,1319].forEach((f,i)=>this.tone(f,i*.12,.26,'triangle',.11));
      else if (name === 'level') [587,740,880,1175].forEach((f,i)=>this.tone(f,i*.09,.2,'sine',.1));
      else if (name === 'hit') { this.tone(196,0,.18,'triangle',.1); this.tone(147,.1,.25,'triangle',.08); }

const Adapt = {
  score(r){ if (!r.solved) return 0; if (r.firstTry) return r.hints === 0 ? 1 : Math.max(.4, 1 - .2*r.hints); return r.hints >= 3 ? .2 : .4; },
  push(r){
    const d = App.data; if (!d.settings.autoLevel) return null;
    d.adapt.push(this.score(r)); if (d.adapt.length > 8) d.adapt.shift();
    const lvl = d.settings.level, w = d.adapt;
    const avg = k => w.slice(-k).reduce((p,c)=>p+c,0)/k;
    if (w.length >= 5 && avg(5) >= .85 && lvl < 4) { d.settings.level = lvl + 1; d.adapt = []; return 'up'; }
    if (w.length >= 4 && avg(4) <= .35 && lvl > 1) { d.settings.level = lvl - 1; d.adapt = []; return 'down'; }
    return null;
  }
};
const Stats = {
  rec(key){ const bt = App.data.stats.byType; if (!bt[key]) bt[key] = { n:0, c:0, first:0, hinted:0 }; return bt[key]; },
  wrongAttempt(){ App.data.stats.streak = 0; save(); },
  hintUsed(full){ App.data.stats.hints++; if (full) App.data.stats.fullHints++; save(); },
  complete(task, res){
    const d = App.data, st = d.stats, tr = this.rec(task.key);
    st.solved++; tr.n++;
    let gained = 0;
    if (res.solved) {
      st.correct++; tr.c++;
      if (res.firstTry) { st.firstTry++; tr.first++; st.streak++; if (st.streak > st.bestStreak) st.bestStreak = st.streak; }
      if (res.hints > 0) tr.hinted++;
      if (res.firstTry && res.hints === 0) { gained = 2; st.selfSolved++; } else gained = 1;
      if (!res.firstTry) st.persist++;
    } else st.streak = 0;
    st.crystals += gained;
    let learned = null;
    if (res.solved && task.tech) learned = this.techCredit(task.tech, res.firstTry ? 1 : .5);
    const change = Adapt.push(res);
    const badges = Badges.check();
    save();
    return { gained, learned, change, badges };
  },
  techCredit(t, amount){
    const d = App.data, r = d.tech[t] || (d.tech[t] = { score:0 });
    r.score += amount;
    if (r.score >= 3 && d.learned.indexOf(t) < 0) {
      d.learned.push(t); d.learnedLog.unshift({ t, at:Date.now() }); d.learnedLog = d.learnedLog.slice(0,12);
      d.stats.crystals += 3;
      Toast.show(TECHS[t].icon, 'Приём освоен: «' + TECHS[t].name + '»', '+3 кристалла за новую стратегию!');
      return t;
    }
    return null;
  },
  accuracy(){ const st = App.data.stats; return st.solved ? Math.round(st.firstTry / st.solved * 100) : null; },
  entries(){ return Object.keys(App.data.stats.byType).filter(k => KEY_INFO[k]).map(k => { const r = App.data.stats.byType[k]; return { key:k, n:r.n, ratio:r.n ? r.first/r.n : 0, r }; }); },
  strengths(){ return this.entries().filter(e => e.n >= 3 && e.ratio >= .8).sort((a,b)=>b.ratio-a.ratio || b.n-a.n); },
  troubles(){ return this.entries().filter(e => e.n >= 3 && e.ratio < .7).sort((a,b)=>a.ratio-b.ratio); }
};

/* ---- Числовая прямая (SVG из чисел) ---- */
let SVG_UID = 0;

  const lo = o.lo, hi = o.hi, span = Math.max(1, hi - lo), W = 1000, P = 40, Y = o.baseY || 120, H = Y + 112;
  const X = v => P + (v - lo) / span * (W - 2*P);

  if (o.island != null && o.island >= lo && o.island <= hi) g += `<ellipse cx="${X(o.island)}" cy="${Y+6}" rx="34" ry="14" fill="#c9f2d9"/><text x="${X(o.island)}" y="${Y-26}" font-size="34" text-anchor="middle">🏝️</text>`;
  g += `<line x1="${P-16}" y1="${Y}" x2="${W-P+16}" y2="${Y}" stroke="#93a0c2" stroke-width="5" stroke-linecap="round"/>`;
  for (let v = lo; v <= hi; v++) {
    const x = X(v), major = v % 10 === 0, mid = v % 5 === 0, len = major ? 18 : mid ? 12 : 7;
    g += `<line x1="${x}" y1="${Y-len}" x2="${x}" y2="${Y+len}" stroke="${major?'#64719a':'#b4bdd5'}" stroke-width="${major?3:1.6}"/>`;
  }
  const special = new Set(); (o.jumps||[]).forEach(j => { special.add(j.from); special.add(j.to); }); if (o.pos != null) special.add(o.pos);
  const every = span <= 12 ? 1 : span <= 24 ? 2 : span <= 40 ? 5 : 10;
  const labels = [];
  for (let v = lo; v <= hi; v++) if (v % every === 0 || special.has(v)) labels.push(v);
  const rows = [-1e9,-1e9,-1e9], minGap = 54;

    const x = X(v), sp = special.has(v);
    let row = 0; while (row < 2 && x - rows[row] < minGap) row++;

    rows[row] = x;
    const y = Y + 46 + row*30;
    if (row > 0) g += `<line x1="${x}" y1="${Y+20}" x2="${x}" y2="${y-22}" stroke="#d3d9ea" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    g += `<text x="${x}" y="${y}" font-size="${sp?28:24}" font-weight="${sp?800:600}" text-anchor="middle" fill="${sp?'#243150':'#7d88a5'}" font-family="Trebuchet MS, sans-serif">${v}</text>`;
  });
  (o.jumps||[]).forEach(j => {
    const x1 = X(j.from), x2 = X(j.to), fwd = j.to >= j.from, mx = (x1+x2)/2;
    const h = clamp(16 + Math.abs(x2-x1)*.32, 24, Y - 34);

    const lw = 18 + String(j.label).length*15;

    g += `<text x="${mx}" y="${Y-8-h-6}" font-size="24" font-weight="800" text-anchor="middle" fill="${col}" font-family="Trebuchet MS, sans-serif">${String(j.label).replace('−','&#8722;')}</text>`;
  });

  return `<svg class="nl-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Числовая прямая от ${lo} до ${hi}">${g}</svg>`;
}

const TIMED_SECONDS = 90;
const Game = {
  s:null, ui:null,
  start(mode, opts){
    opts = opts || {};
    this.stop();
    const def = MODES[mode]; if (!def) return;
    const s = this.s = { mode, opts, def, index:0, total: opts.timed ? Infinity : (opts.len || def.len), task:null,
      attempts:0, hintLevel:0, done:false, results:[], crystals:0, skills:new Set(), newBadges:[], learned:[],
      recent:[], lastTpl:null, similar:null, timer:null, timeLeft:0, tool:null, lastAct:0, orderSeq:[] };
    if (mode === 'dragon') s.dragon = { max:8, power:8 };
    App.data.lastMode = mode; save();
    UI.show('game');
    this.buildShell();
    if (opts.timed) { s.timeLeft = TIMED_SECONDS; s.timer = setInterval(() => this.tick(), 1000); }
    const intro = { lightning:'Считаем в уме! Не спеши: важна точность, а не скорость.', bridge:'На этом мосту главное — сначала дойти до круглого числа.',
      round:'В Городе круглых чисел всё считается легко. Ищи круглые ступеньки!', detectives:'В пещере спрятались числа. Найдём их с помощью обратных действий!',
      constructor:'В Мастерской собираем решения из удобных частей.', dragon:'Дракон охраняет башню. Каждый верный ответ забирает у него волшебную звёздочку!',
      tech:'Потренируем приём! Если что — подсказки рядом.' }[mode];
    this.ui.fox.say(intro, 'happy');
    this.next(true);
  },
  stop(){ if (this.s && this.s.timer) clearInterval(this.s.timer); this.s = null; },
  ctx(){
    const s = this.s, d = App.data;
    const opPref = (s.opts.free && s.opts.free.op) || s.opts.op || d.settings.op;
    return { level:d.settings.level, free:s.opts.free || null, tech:s.opts.tech || null, index:s.index, opMode:opPref,
      opSel: () => opPref === 'add' ? '+' : opPref === 'sub' ? '-' : (chance(.5) ? '+' : '-') };
  },
  blocked(){ const now = Date.now(); if (now - this.s.lastAct < 300) return true; this.s.lastAct = now; return false; },
  tick(){
    const s = this.s; if (!s) return;
    s.timeLeft--; this.updateHead();
    if (s.timeLeft <= 0) { clearInterval(s.timer); s.timer = null; this.finish(); }
  },

  buildShell(){
    const s = this.s, root = clear($('#scr-game')), u = this.ui = {};
    const lvlSel = el('select', { class:'lvl-select', 'aria-label':'Уровень сложности' });
    [1,2,3,4].forEach(n => { const o = el('option', { value:String(n) }, `${LEVELS[n].icon} ${LEVELS[n].name}`); if (App.data.settings.level === n) o.selected = true; lvlSel.appendChild(o); });
    lvlSel.addEventListener('change', () => { App.data.settings.level = +lvlSel.value; App.data.adapt = []; save(); Toast.show(LEVELS[+lvlSel.value].icon, 'Уровень: ' + LEVELS[+lvlSel.value].name, 'Следующие задания будут на этом уровне.'); });
    u.lvlSel = lvlSel;
    root.appendChild(el('div', { class:'game-head' },
      el('button', { class:'btn btn-soft btn-sm', type:'button', onclick:onTap(goHome) }, '🏠', el('span', { class:'hide-xs' }, ' На главную')),
      el('div', { class:'game-title' }, el('span', { class:'gt-icon', 'aria-hidden':'true' }, s.def.icon),
        el('div', null, el('div', { class:'gt-world' }, s.def.world), el('div', { class:'gt-name' }, s.opts.title || s.def.title))),
      lvlSel));
    u.dots = el('div', { class:'dots', 'aria-hidden':'true' });
    u.count = el('div', { style:'font-weight:800;color:var(--ink2)' });
    u.timer = s.opts.timed ? el('div', { class:'timer', role:'progressbar', 'aria-label':'Оставшееся время' }, el('i', { style:'width:100%' })) : null;
    root.appendChild(el('div', { class:'progress-row' }, u.count, u.dots, u.timer));
    u.fox = makeFox('');
    const side = el('aside', { class:'side' + (s.dragon ? ' has-dragon' : '') }, u.fox.fox, u.fox.bubble);
    if (s.dragon) {
      u.orbs = el('div', { class:'orbs', 'aria-hidden':'true' });
      u.dragonLbl = el('div', { class:'dl' });
      u.dragon = el('div', { class:'dragon-box' }, el('div', { html:DRAGON_SVG }).firstChild, el('div', null, u.orbs, u.dragonLbl));
      side.appendChild(u.dragon);
    }
    u.card = el('div', { class:'card task-card' });
    u.toolPanel = el('div', { class:'tool-panel', hidden:true });
    root.appendChild(el('div', { class:'game-grid' }, side, el('div', null, u.card, u.toolPanel)));
  },
  updateHead(){
    const s = this.s, u = this.ui; if (!s) return;
    clear(u.dots);
    if (s.total !== Infinity) {
      for (let i = 0; i < s.total; i++) { const r = s.results[i]; u.dots.appendChild(el('i', { class: r ? (!r.solved ? 'shown' : (r.firstTry && !r.hints ? 'ok' : 'help')) : (i === s.index-1 ? 'cur' : '') })); }
      u.count.textContent = s.dragon ? `Испытание ${s.index}` : `Задание ${s.index} из ${s.total}`;
    } else u.count.textContent = `Решено: ${s.results.filter(r=>r.solved).length} · ⏱ ${Math.max(0,s.timeLeft)} с`;
    if (u.timer) u.timer.firstChild.style.width = (Math.max(0, s.timeLeft) / TIMED_SECONDS * 100) + '%';
    if (s.dragon) {
      clear(u.orbs); for (let i = 0; i < s.dragon.max; i++) u.orbs.appendChild(el('i', { class: i < s.dragon.power ? '' : 'gone' }));
      u.dragonLbl.textContent = s.dragon.power > 0 ? `Волшебная сила дракона: ${s.dragon.power} из ${s.dragon.max}` : 'Дракон без сил!';
    }
    if (u.lvlSel && +u.lvlSel.value !== App.data.settings.level) u.lvlSel.value = String(App.data.settings.level);
  },
  makeTask(){
    const s = this.s; let t = null;
    for (let i = 0; i < 14; i++) {
      let c = null;
      try { c = s.similar ? s.similar() : s.def.make(this.ctx()); } catch(e){ c = null; }
      if (!c) continue;
      if (s.similar && !c.remake) c.remake = s.similar;
      t = c;
      const tpl = c.type + ':' + c.key;
      if (s.recent.indexOf(c.sig) < 0 && (i > 7 || tpl !== s.lastTpl || s.similar || s.mode === 'lightning' || s.mode === 'bridge' || s.mode === 'tech')) break;
    }
    if (!t) { const p = Gen.pair('+', 1, {}); t = Tasks.arith(p[0], '+', p[1]); t.remake = () => { const q = Gen.pair('+',1,{}); return Tasks.arith(q[0],'+',q[1]); }; }
    s.similar = null;
    s.recent.push(t.sig); if (s.recent.length > 10) s.recent.shift();

  next(first){

    card.appendChild(el('div', { class:'task-ask' }, t.view.ask));
    u.input = null; u.slot = null; u.choiceBtns = [];
    if (t.view.big && !t.view.expr) card.appendChild(el('div', { class:'expr' }, el('span', { class:'num' }, t.view.big)));
    if (t.view.big && t.view.expr) card.appendChild(el('div', { class:'big-num', style:'font-size:56px;color:var(--lav-d)' }, t.view.big));
    if (t.view.expr) card.appendChild(this.renderExpr(t));

    card.appendChild(u.visual);

function miniTask(root, k){
  clear(root);
  const lvl = App.data.settings.level;
  let task = null;
  for (let i = 0; i < 6 && (!task || task.kind !== 'number'); i++) task = TECH_MAKERS[k](lvl);
  if (!task || task.kind !== 'number') { const p = Gen.pair('+', 2, { cross:true, bKind:'one' }); task = Tasks.arith(p[0],'+',p[1],{ tech:'A' }); }
  let attempts = 0, hints = 0, done = false;
  const inp = el('input', { type:'text', inputmode: COARSE ? 'numeric' : 'numeric', maxlength:'3', autocomplete:'off', 'aria-label':'Ответ' });
  inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g,'').slice(0,3); if (+inp.value > 100) inp.value = inp.value.slice(0,2); });
  const fb = el('div', { 'aria-live':'polite', style:'margin-top:10px;font-weight:700' });
  const exprRow = el('div', { class:'mt-expr' });
  task.view.expr.forEach(p => exprRow.appendChild(p === SLOT ? inp : el('span', null, String(p))));
  const check = () => {
    if (done) return;
    if (inp.value === '') { fb.textContent = 'Сначала впиши ответ 🙂'; return; }
    if (+inp.value === task.answer) {
      done = true; Sound.play('ok');
      const r = Stats.complete(task, { solved:true, firstTry:attempts === 0, hints, attempts }); updateTop();
      clear(fb); fb.appendChild(el('div', { class:'fb ok' }, el('div', { class:'t' }, '✨ Верно!', el('span', { class:'gain' }, '💎 +' + r.gained)), 'Отлично! Хочешь ещё одно?',
        el('div', { class:'btn-row' }, el('button', { class:'btn btn-primary btn-sm', type:'button', onclick:onTap(() => miniTask(root, k)) }, 'Ещё задание'))));
      inp.disabled = true;
    } else {
      attempts++; Stats.wrongAttempt(); Sound.play('oops');
      fb.textContent = attempts === 1 ? 'Почти! Попробуй ещё раз. ' + task.hints[1] : 'Подсказка: ' + task.hints[2];
      if (attempts >= 2) hints = Math.max(hints, 3);
      inp.focus(); inp.select();
    }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  root.appendChild(el('h3', null, '✏️ Мини-задание'));
  root.appendChild(el('div', { class:'muted', style:'font-weight:700' }, task.view.ask));
  root.appendChild(exprRow);
  root.appendChild(el('div', { class:'btn-row', style:'justify-content:center' },
    el('button', { class:'btn btn-primary btn-sm', type:'button', onclick:onTap(check) }, '✔ Проверить'),
    el('button', { class:'btn btn-sun btn-sm', type:'button', onclick:onTap(() => { if (done) return; hints = Math.min(3, hints+1); Stats.hintUsed(false); fb.textContent = '💡 ' + task.hints[hints-1]; }) }, '💡 Подсказка')));
  root.appendChild(fb);
}

/* Мини-игра «Дружба до десяти / до ста» */
const Pairs = {
  start(target){
    const root = clear($('#scr-pairs'));
    const lvl = App.data.settings.level;
    const st = { target, sel:null, found:0, moves:0 };
    let nums = [];
    const used = new Set();
    while (nums.length < 10) {
      let a;
      if (target === 10) a = rnd(1,5);
      else a = lvl >= 3 ? rnd(11,49) : rnd(1,5)*10;
      if (target === 100 && a%10 === 0 && lvl >= 3) a++;
      const key = Math.min(a, target - a);
      if (used.has(key) && used.size < (target === 10 ? 5 : 30)) continue;
      used.add(key); nums.push(a, target - a);
    }
    nums = shuffle(nums);
    const fx = makeFox('sm');
    const board = el('div', { class:'pairs-board', role:'group', 'aria-label':'Карточки с числами' });
    const info2 = el('div', { class:'tool-note', style:'text-align:center' }, 'Найдено пар: 0 из 5');
    const cards = nums.map((v,i) => {
      const b = el('button', { class:'pcard', type:'button', 'aria-label':'Число ' + v, onclick:() => tap(i) }, String(v));
      board.appendChild(b); return b;
    });
    const tap = i => {
      const b = cards[i]; if (b.classList.contains('done')) return;
      Sound.play('tap');
      if (st.sel === null) { st.sel = i; b.classList.add('sel'); return; }
      if (st.sel === i) { b.classList.remove('sel'); st.sel = null; return; }
      const j = st.sel, a = nums[i], c = nums[j]; st.moves++;
      cards[j].classList.remove('sel'); st.sel = null;
      if (a + c === target) {
        b.classList.add('done'); cards[j].classList.add('done'); b.disabled = true; cards[j].disabled = true;
        st.found++; Sound.play('ok'); fx.say(`${c} и ${a} — друзья! Вместе ${target}.`, 'happy');
        info2.textContent = `Найдено пар: ${st.found} из 5`;
        if (st.found === 5) win();
      } else {
        [b, cards[j]].forEach(x => { x.classList.remove('no'); void x.offsetWidth; x.classList.add('no'); });
        Sound.play('oops'); fx.say(`${c} + ${a} = ${a+c}. А нам нужно ${target}. ${a+c < target ? 'Маловато' : 'Многовато'} — поищем другого друга!`, 'think');
      }
    };
    const win = () => {
      const d = App.data; d.stats.pairsGames++; d.stats.crystals += 3; Stats.techCredit('D', 1); Badges.check(); save(); updateTop();
      Sound.play('win'); Fx.confetti();
      fx.say(`Все пары найдены за ${st.moves} ${plural(st.moves,'ход','хода','ходов')}! Держи 3 кристалла.`, 'happy');
      board.after(el('div', { class:'btn-row', style:'justify-content:center' },
        el('button', { class:'btn btn-primary', type:'button', onclick:onTap(() => Pairs.start(target)) }, '🔁 Ещё раз'),
        el('button', { class:'btn btn-lav', type:'button', onclick:onTap(() => Pairs.start(target === 10 ? 100 : 10)) }, target === 10 ? '💯 Пары до 100' : '🔟 Пары до 10'),
        el('button', { class:'btn btn-soft', type:'button', onclick:onTap(() => openTech('D')) }, '📘 К приёму')));
    };
    root.appendChild(el('div', { class:'game-head' }, el('button', { class:'btn btn-soft btn-sm', type:'button', onclick:onTap(goHome) }, '🏠 На главную'),
      el('div', { class:'game-title' }, el('span', { class:'gt-icon' }, '🤝'), el('div', null, el('div', { class:'gt-world' }, 'Мини-игра'), el('div', { class:'gt-name' }, target === 10 ? 'Дружба до десяти' : 'Дружба до ста')))));
    root.appendChild(el('div', { class:'card' }, el('div', { class:'fox-wrap' }, fx.fox, fx.bubble), board, info2));
    fx.say(`Найди пары чисел, которые вместе дают ${target}. Нажми на два числа-друга!`);
  }
};

function onGlobalKey(e){
  if (UI.current !== 'game' || !Game.s || Modal.isOpen()) return;
  const s = Game.s, t = s.task; if (!t) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'SELECT' || (tag === 'INPUT' && e.target !== Game.ui.input)) return;
  if (e.key === 'Enter') {
    if (tag === 'BUTTON' || tag === 'INPUT') return;
    if (s.done) { e.preventDefault(); Game.next(); }
    else if (t.kind !== 'choice') { e.preventDefault(); Game.submit(); }
    return;
  }
  if (tag === 'INPUT') return;
  if (!s.done && t.kind === 'number' && /^\d$/.test(e.key)) { e.preventDefault(); Game.key(e.key); if (Game.ui.input) Game.ui.input.focus(); return; }
  if (!s.done && t.kind === 'number' && e.key === 'Backspace') { e.preventDefault(); Game.key('⌫'); return; }
  if (!s.done && t.kind === 'choice' && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; const b = Game.ui.choiceBtns[i]; if (b && !b.disabled) { e.preventDefault(); Game.choose(i, b); } }
}
