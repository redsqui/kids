<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Умножайка — таблица умножения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#2b2a4c;--muted:#6f6d92;--card:#fff;
  --violet:#7c5cff;--violet-d:#5b3df0;--violet-s:#efeaff;
  --mint:#22b892;--mint-d:#179474;--mint-s:#dcf6ee;
  --sun:#ffc53d;--sun-d:#e9a400;--sun-s:#fff3d1;
  --coral:#ff8a6b;--coral-d:#e86a4b;--coral-s:#ffe9e2;
  --sky:#3aa8f5;--sky-s:#e3f2ff;--sky-d:#b9dcf7;
  --r:24px;--sh:0 8px 24px rgba(76,60,160,.12);
}
html,body{margin:0}
body{
  font-family:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color:var(--ink);font-weight:700;min-height:100vh;
  background:linear-gradient(160deg,#e9f0ff 0%,#f6edff 55%,#fff5e6 100%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.deco{position:fixed;border-radius:50%;z-index:-1;pointer-events:none}
.deco.p1{width:180px;height:180px;right:-50px;top:120px;background:radial-gradient(circle at 35% 35%,#ffe08a,#ffb84d);opacity:.35}
.deco.p2{width:110px;height:110px;left:-30px;bottom:80px;background:radial-gradient(circle at 35% 35%,#c9b8ff,#8f74ff);opacity:.3}
.deco.p3{width:60px;height:60px;left:12%;top:90px;background:radial-gradient(circle at 35% 35%,#aef0dc,#3cc9a2);opacity:.3}

/* ---------- Верхняя панель ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(76,60,160,.08)}
.logo{font-weight:900;font-size:1.3rem;display:flex;align-items:center;gap:6px;background:none;padding:4px}
.logo .lg-emoji{font-size:1.7rem}
.pills{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#fff;border-radius:999px;padding:7px 12px;font-weight:900;box-shadow:var(--sh);font-size:1rem;white-space:nowrap}
.pill.bump{animation:pop .4s}
.icon-btn{width:44px;height:44px;border-radius:50%;background:#fff;font-size:1.25rem;box-shadow:var(--sh);flex:none}
@media(max-width:560px){.logo .lg-text{display:none}.topbar{gap:6px;padding:8px 10px}.pills{flex-wrap:nowrap;gap:5px}.pill{padding:6px 8px;font-size:.88rem}.icon-btn{width:38px;height:38px;font-size:1.1rem}}

main{max-width:980px;margin:0 auto;padding:18px 16px 70px}
.screen{animation:fadeUp .35s ease both}
.center{text-align:center}
.muted{color:var(--muted);font-weight:700}
.h1{font-size:clamp(1.7rem,5vw,2.3rem);margin:8px 0 16px;font-weight:900}
.sec{font-size:1.35rem;margin:28px 4px 12px;font-weight:900}

/* ---------- Кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:14px 24px;
  font-size:1.15rem;font-weight:900;background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--violet-d);
  transition:transform .12s,box-shadow .12s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--violet-d)}
.btn.hero{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-d);font-size:clamp(1.3rem,4.5vw,1.6rem);padding:20px 34px;width:100%;max-width:520px;animation:pulse 2.6s ease-in-out infinite}
.btn.hero:active{box-shadow:0 1px 0 var(--sun-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.btn.ghost{background:#fff;color:var(--violet-d);box-shadow:0 4px 0 #ddd5ff}
.btn.small{font-size:1rem;padding:10px 16px;border-radius:16px}
.row-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* ---------- Персонаж ---------- */
.mascot-row{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.mascot{width:116px;height:116px;flex:none;overflow:visible}
.mascot-row.small .mascot{width:78px;height:78px}
.mascot .m-body{transform-box:fill-box;transform-origin:center bottom;animation:float 3.2s ease-in-out infinite}
.mascot .eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.mascot .eyes-happy{display:none}
.mascot.happy .eyes-happy{display:inline}
.mascot.happy .eyes-open{display:none}
.mascot.happy{animation:hop .6s ease 2}
.mascot.think{animation:tilt 1.2s ease}
.mascot.support{animation:nod .9s ease}
.mascot .wing{transform-box:fill-box;transform-origin:top center}
.mascot.happy .wing.l{animation:flapL .3s ease 4}
.mascot.happy .wing.r{animation:flapR .3s ease 4}
.bubble{position:relative;background:#fff;border-radius:22px;padding:14px 18px;font-size:clamp(1.02rem,3.4vw,1.2rem);box-shadow:var(--sh);line-height:1.35}
.bubble::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble.pop{animation:pop .35s}

/* ---------- Главная ---------- */
.hero-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 22px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.today-title{font-size:1.2rem;font-weight:900}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:#fff;border-radius:var(--r);padding:18px 10px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:1.05rem;font-weight:800;text-align:center;line-height:1.2;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:2.5rem;width:74px;height:74px;border-radius:22px;display:grid;place-items:center}
.tile .ti.num{font-size:1.9rem;font-weight:900}
.c1 .ti{background:var(--sun-s)}.c2 .ti{background:var(--mint-s)}.c3 .ti{background:var(--sky-s)}
.c4 .ti{background:var(--violet-s)}.c5 .ti{background:var(--coral-s)}.c6 .ti{background:#fde7f5}
.tile.feature{border:3px solid var(--mint-s)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 14px}
.chips.center{justify-content:center}
.chip{background:var(--violet-s);color:var(--violet-d);border-radius:999px;padding:10px 16px;font-size:1.2rem;font-weight:900;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--violet);color:#fff}
.stars{letter-spacing:2px;font-size:1.15rem}
.stars .on{color:#ffb800}.stars .off{color:#dcd8ee}

/* ---------- Игровой экран ---------- */
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.rtitle{font-weight:900;font-size:1.15rem}
.dots{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:12px;height:12px;border-radius:50%;background:#dcd6f5;transition:all .2s}
.dots i.done{background:var(--mint)}.dots i.cur{background:var(--sun);transform:scale(1.35)}
.qcard{background:#fff;border-radius:28px;box-shadow:var(--sh);padding:24px 18px;text-align:center;animation:pop .35s}
.qtitle{font-size:1.3rem;font-weight:900;margin-bottom:6px}
.eq{font-size:clamp(2.5rem,10vw,4rem);font-weight:900;letter-spacing:1px;line-height:1.15}
.qm{display:inline-block;min-width:1.1em;color:var(--violet);background:var(--violet-s);border-radius:16px;padding:0 .18em;animation:wiggle 1.8s ease-in-out infinite}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:22px auto 10px;max-width:520px}
@media(min-width:720px){.opts.grid4{grid-template-columns:repeat(4,1fr);max-width:none}}
.opt{background:var(--sky-s);font-size:clamp(1.7rem,6vw,2.1rem);font-weight:900;border-radius:22px;padding:18px 8px;box-shadow:0 5px 0 var(--sky-d);transition:transform .12s,opacity .2s}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--sky-d)}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint);color:#fff;box-shadow:0 5px 0 var(--mint-d);animation:pop .45s}
.opt.tried{opacity:.4;animation:shake .4s}
.opt.show{outline:4px dashed var(--mint);outline-offset:3px}
.opts.tf .opt{font-size:clamp(1.3rem,5vw,1.6rem)}
.opts.cards{grid-template-columns:1fr 1fr}
.opts.cards .opt{font-size:clamp(1.25rem,4.6vw,1.55rem);display:flex;justify-content:center;gap:8px;align-items:center;background:#fff;border:3px solid var(--sky-s)}
.opts.cards .opt .arrow{color:var(--muted);font-size:1rem}
.opts.cards .opt.right{border-color:var(--mint)}
.seq{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:clamp(1.6rem,6.5vw,2.3rem);font-weight:900}
.seq .gone{color:var(--violet)}
.story{display:flex;gap:16px;align-items:center;text-align:left;font-size:clamp(1.12rem,3.8vw,1.35rem);line-height:1.45;max-width:640px;margin:0 auto}
.story-emoji{font-size:3.6rem;flex:none;animation:float 3s ease-in-out infinite}
.hint-area{margin-top:4px}
.hstep{background:var(--sun-s);border-radius:16px;padding:10px 14px;margin:8px auto;max-width:540px;font-size:clamp(1.05rem,3.6vw,1.22rem);animation:fadeUp .35s both}
.hstep.final{background:var(--mint-s)}
.scaffold{display:inline-block;margin-top:12px;background:var(--sun-s);border-radius:14px;padding:6px 14px;font-size:1.05rem;color:#8a6200}
.hard-btn{margin-top:10px}
#feedback{margin-top:16px}
.fb{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:18px;animation:fadeUp .35s both;text-align:center}
.fb.good{border:3px solid var(--mint-s)}.fb.soft{border:3px solid var(--sun-s)}
.fb h3{margin:0 0 8px;font-size:1.6rem}
.fb p{font-size:1.12rem;margin:8px 0}
.remember{font-size:1.35rem!important}

/* ---------- Объяснение ---------- */
.explain{background:#fff;border-radius:24px;padding:16px;box-shadow:var(--sh);text-align:center}
.ex-title{font-size:clamp(1.9rem,7vw,2.4rem);font-weight:900}
.ex-title .ans{color:var(--violet)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tabs button{background:var(--violet-s);color:var(--violet-d);border-radius:999px;padding:9px 14px;font-weight:800;font-size:1rem}
.tabs button.on{background:var(--violet);color:#fff}
.tab-body{min-height:120px}
.lead{font-size:1.15rem;margin:6px 0 10px}
.erows{display:flex;flex-direction:column;gap:4px;align-items:center}
.erow{display:flex;align-items:center;gap:10px;animation:fadeUp .3s both}
.erow .items{font-size:var(--es,1.4rem);letter-spacing:1px;line-height:1.2}
.erow .sum{min-width:2.6em;background:var(--sun-s);border-radius:10px;padding:2px 8px;font-weight:900}
.addline{font-size:clamp(1.2rem,4.5vw,1.6rem);font-weight:900;margin:8px 0;line-height:1.5}
.skip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0}
.skip span{background:var(--sky-s);border-radius:12px;padding:4px 10px;font-weight:900;animation:pop .3s both}
.skip i{color:var(--muted);font-style:normal}
.dots-grid{display:inline-grid;gap:5px;margin:10px auto;padding:10px;background:#faf9ff;border-radius:16px}
.dot{width:var(--ds,18px);height:var(--ds,18px);border-radius:50%;background:var(--violet);animation:pop .3s both}
.dot.d2{background:var(--coral)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:1.05rem}
.legend .lg{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-1px;margin-right:4px;background:var(--violet)}
.legend .lg.d2{background:var(--coral)}
.memo{display:flex;gap:12px;align-items:center;background:var(--sun-s);border-radius:18px;padding:14px;text-align:left;font-size:clamp(1.05rem,3.6vw,1.2rem);margin:8px 0;line-height:1.4}
.memo.alt{background:var(--sky-s)}
.memo .mi{font-size:2.3rem;flex:none}
.comm{margin-top:12px;color:var(--muted);font-size:1.05rem}

/* ---------- Учимся ---------- */
.learn-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media(max-width:720px){.learn-layout{grid-template-columns:1fr}.ex-list{display:grid!important;grid-template-columns:repeat(2,1fr)}}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-row{display:flex;justify-content:space-between;background:#fff;border-radius:16px;padding:12px 16px;font-size:1.2rem;font-weight:800;box-shadow:var(--sh);transition:transform .12s}
.ex-row:hover{transform:translateX(3px)}
.ex-row.on{background:var(--violet);color:#fff}
.tstars{font-size:1rem}

/* ---------- Таблица ---------- */
.mgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;max-width:640px;margin:0 auto}
.gh,.cell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:clamp(.72rem,2.6vw,1.05rem);transition:all .18s}
.gh{background:var(--violet-s);color:var(--violet-d)}
.gh.corner{background:var(--violet);color:#fff}
.gh.hl{background:var(--violet);color:#fff;transform:scale(1.08)}
.cell{background:#fff;box-shadow:0 2px 6px rgba(76,60,160,.08);position:relative}
.cell.easy{background:#f6f5fb;color:var(--muted)}
.cell.seen{background:var(--sky-s)}
.cell.good{background:var(--mint-s)}
.cell.mastered{background:linear-gradient(135deg,#fff3c4,#ffe082)}
.cell.mastered::after{content:'★';position:absolute;top:1px;right:3px;font-size:.6em;color:#e9a400}
.cell.growing{background:var(--coral-s);box-shadow:inset 0 0 0 2px #ffc9b8}
.cell.hl{transform:scale(1.04);box-shadow:inset 0 0 0 3px var(--sun)}
.cell.sel{background:var(--sun)!important;color:var(--ink);transform:scale(1.18);z-index:2;box-shadow:0 6px 16px rgba(233,164,0,.4)}
.glegend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;margin:14px 0;font-size:.98rem}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.glegend b{width:18px;height:18px;border-radius:6px;display:inline-block}
.ginfo{text-align:center;margin-top:14px}
.ginfo .big{font-size:2.2rem;font-weight:900}

/* ---------- Хитрости ---------- */
.tricks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.trick h3{margin:0 0 8px;font-size:1.3rem;display:flex;gap:8px;align-items:center}
.trick h3 .tag{background:var(--violet);color:#fff;border-radius:12px;padding:2px 10px}
.trick p{margin:6px 0;font-size:1.08rem;line-height:1.45}
.trick .ex{background:var(--sky-s);border-radius:12px;padding:8px 12px;font-size:1.15rem;margin:6px 0}
.trick.wide{grid-column:1/-1}
.nine{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.nine span{background:#faf9ff;border-radius:10px;padding:4px 8px;font-size:1.1rem}
.nine .t{color:var(--violet)}.nine .u{color:var(--coral-d)}
.fingers{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:110px;margin:10px 0}
.finger{width:24px;height:90px;border-radius:14px 14px 6px 6px;background:#ffd2b0;transition:height .3s,background .3s}
.finger.bent{height:36px;background:#e9a58a}
.finger.left{background:#c9b8ff}
.fgap{width:14px}
.fbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fbtns button{width:42px;height:42px;border-radius:12px;background:var(--violet-s);color:var(--violet-d);font-weight:900;font-size:1.1rem}
.fbtns button.on{background:var(--violet);color:#fff}
.rot-box{display:flex;justify-content:center;align-items:center;min-height:200px}
.rot{transition:transform .7s cubic-bezier(.5,1.6,.4,1)}
.rot.turned{transform:rotate(90deg)}

/* ---------- Профиль ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:16px;text-align:center}
.stat .v{font-size:1.9rem;font-weight:900}
.stat .l{color:var(--muted);font-size:.98rem}
.bar{height:14px;background:var(--violet-s);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#a98bff);border-radius:999px;transition:width .6s}
.trows{display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:10px 16px;box-shadow:var(--sh)}
.trow .n{font-weight:900;font-size:1.3rem;width:52px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach{background:#fff;border-radius:20px;padding:14px;text-align:center;box-shadow:var(--sh)}
.ach .i{font-size:2.3rem}
.ach .t{font-weight:900}
.ach .d{font-size:.9rem;color:var(--muted)}
.ach.locked{opacity:.45;filter:grayscale(1)}

/* ---------- Блиц ---------- */
.tbar{height:16px;background:var(--violet-s);border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));transition:width 1s linear}
.tleft{font-weight:900;font-size:1.2rem;min-width:56px;text-align:right}
#blitzFb{min-height:52px;margin-top:10px;font-size:1.3rem;font-weight:900}
.flash-ok{color:var(--mint-d);animation:pop .3s}
.flash-soft{color:#b07800;animation:pop .3s}

/* ---------- Модальное окно, тосты, конфетти ---------- */
.modal{position:fixed;inset:0;background:rgba(43,42,76,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal.hidden{display:none}
.modal-card{background:#f8f6ff;border-radius:28px;max-width:660px;width:100%;max-height:90vh;overflow:auto;padding:22px 18px;position:relative;animation:pop .3s}
.modal-x{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;background:#fff;font-size:1.2rem;box-shadow:var(--sh);z-index:2}
.modal-card h2{margin:4px 0 16px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;font-size:1.15rem;flex-wrap:wrap}
.confirm{background:var(--coral-s);border-radius:18px;padding:16px;text-align:center;font-size:1.1rem;animation:fadeUp .3s}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:18px;padding:12px 18px;font-size:1.08rem;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:toastIn .4s both}
.toast.out{animation:toastOut .4s both}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.9s ease-in forwards}

/* ---------- Анимации ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:.4}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-9deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}

'use strict';

/* =====================================================================
   1. УТИЛИТЫ
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = n => Math.floor(Math.random() * n);

const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

}

/* =====================================================================
   2. ДАННЫЕ ТАБЛИЦЫ, МНЕМОНИКА, ИСТОРИИ
   ===================================================================== */

const ALL = [];
for (let x = 2; x <= 10; x++) for (let y = x; y <= 10; y++) ALL.push(key(x, y)); // 45 уникальных фактов

const ITEMS = ['🍎', '⭐', '🍬', '🪙', '🐞', '🌸', '🍓', '💎', '🐟', '🍪', '🚀'];

const HARD_PAIRS = [[6, 7], [7, 8], [8, 9], [6, 8], [7, 9], [6, 9], [7, 7], [8, 8], [6, 6], [4, 7], [3, 8], [4, 8]];

const STORIES = [

];

const PRAISE = ['Правильно! 🎉', 'Супер! ⭐', 'Ты молодец! 💪', 'Отлично! 🌟', 'Точно в цель! 🎯', 'Вот это да! 🚀', 'Умница! 🦉'];

const GAME_MODES = ['choice', 'missing', 'sequence', 'tf', 'odd', 'detective', 'blitz'];
const DAILY_MODES = ['choice', 'choice', 'missing', 'sequence', 'tf', 'odd', 'detective'];

/* =====================================================================
   3. СОСТОЯНИЕ ПОЛЬЗОВАТЕЛЯ И localStorage
   ===================================================================== */
const STORE_KEY = 'umnozhayka_v1';
function defaultState() {
  return { stars: 0, coins: 0, streak: 0, best: 0, answers: 0, facts: {}, ach: [], modes: [], sound: false, comebacks: 0, blitzBest: 0 };
}
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return Object.assign(defaultState(), JSON.parse(raw)); } catch (e) { }
  return defaultState();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }
let S = load();

/* =====================================================================
   4. ПРОГРЕСС ПО ФАКТАМ (умное повторение)
   ===================================================================== */
function getF(a, b) { const k = key(a, b); if (!S.facts[k]) S.facts[k] = { c: 0, w: 0, h: 0, s: 0, last: 0 }; return S.facts[k]; }
function levelK(k) {
  const f = S.facts[k]; if (!f) return 0;
  let l = Math.min(5, f.s + (f.c >= 6 ? 1 : 0));
  if (f.w > f.c) l = Math.min(l, 1);
  return l;
}
const level = (a, b) => (a === 1 || b === 1) ? 5 : levelK(key(a, b));
const seenK = k => { const f = S.facts[k]; return !!f && (f.c + f.w + f.h) > 0; };
function weight(k) {
  const f = S.facts[k]; if (!f) return 3;
  const lv = levelK(k);
  let w = [8, 6, 4, 2.5, 1.2, 0.6][lv];
  if (f.w > f.c) w += 3;
  const days = (Date.now() - (f.last || 0)) / 864e5;
  w += Math.min(3, days * 0.7);
  return w;
}
function tableStars(n) { let s = 0; for (let m = 2; m <= 10; m++) s += level(n, m); return Math.round(s / 9); }
function learnedPct() { return Math.round(ALL.filter(k => levelK(k) >= 3).length / ALL.length * 100); }
const playerLevel = () => 1 + Math.floor(S.stars / 30);
function weakFacts(n) {
  return ALL.filter(k => S.facts[k] && S.facts[k].w > 0 && levelK(k) < 3)
    .map(k => ({ k, f: S.facts[k], lv: levelK(k) }))
    .sort((x, y) => (y.f.w - y.f.c * 0.5) - (x.f.w - x.f.c * 0.5) || x.lv - y.lv)
    .slice(0, n).map(o => { const [a, b] = parseK(o.k); return { a: b, b: a }; });
}
function candidates(cfg) {
  if (cfg.table) return [...new Set(TABLES.map(m => key(cfg.table, m)))];
  if (cfg.hard) return HARD_PAIRS.map(([a, b]) => key(a, b));
  const t = S.answers;
  let allowed;
  if (t < 15) allowed = [2, 5, 10];
  else if (t < 35) allowed = [2, 3, 4, 5, 10];
  else if (t < 60) allowed = [2, 3, 4, 5, 6, 9, 10];
  else return ALL;
  return ALL.filter(k => { const [a, b] = parseK(k); return allowed.includes(a) || allowed.includes(b); });
}
// Взвешенный выбор: сложные примеры чаще, но не подряд
function pickFact(cfg, recent) {
  let ks = candidates(cfg);
  const fresh = ks.filter(k => !recent.includes(k));
  if (fresh.length >= 2) ks = fresh;
  const ws = ks.map(weight), sum = ws.reduce((s, x) => s + x, 0);
  let r = Math.random() * sum, k = ks[ks.length - 1];
  for (let i = 0; i < ks.length; i++) { r -= ws[i]; if (r <= 0) { k = ks[i]; break; } }
  recent.push(k); if (recent.length > 3) recent.shift();
  let [a, b] = parseK(k);
  if (Math.random() < 0.5) [a, b] = [b, a];
  return [a, b];
}

/* =====================================================================
   5. СИСТЕМА ПОДСКАЗОК: стратегии и мнемоника
   ===================================================================== */
function strategy(a, b) {
  const p = a * b, has = n => a === n || b === n, oth = n => (a === n ? b : a);
  const fin = `Значит ${a} × ${b} = ${p}!`;
  if (has(1)) return { steps: ['Умножить на 1 — число не меняется', fin], guide: ['Умножить на 1 — число не меняется. Что получится?'], short: 'число не меняется', nudge: '×1 — число не меняется' };
  if (has(10)) { const n = oth(10); return { steps: ['Умножить на 10 — просто допиши 0', `${n} → ${n}0`, fin], guide: [`Умножить на 10 — допиши к ${n} ноль`], short: `допиши 0 к ${n}`, nudge: '×10 — допиши ноль' }; }
  if (has(2)) { const n = oth(2); return { steps: ['×2 — это просто удвоить число', `${n} + ${n} = ${p}`, fin], guide: [`×2 — это удвоить: ${n} + ${n} = ?`], short: `${n} + ${n}`, nudge: 'Удвой число' }; }
  if (has(5)) { const n = oth(5); return { steps: [`Вспомни ${n} × 10 = ${n * 10}`, '×5 — это половина от ×10', `Половина от ${n * 10} — это ${p}`, fin], guide: [`${n} × 10 = ${n * 10}`, `×5 — это половина. Сколько будет половина от ${n * 10}?`], short: `половина от ${n} × 10`, nudge: `Вспомни ${n} × 10` }; }
  if (has(9)) { const n = oth(9); return { steps: [`Вспомни ${n} × 10 = ${n * 10}`, `9 раз по ${n} — это 10 раз по ${n}, но без одного ${n}`, `${n * 10} − ${n} = ${p}`, fin], guide: [`${n} × 10 = ${n * 10}`, `Убери одно ${n}: ${n * 10} − ${n} = ?`], short: `${n} × 10 − ${n}`, nudge: `Вспомни ${n} × 10` }; }
  if (has(4)) { const n = oth(4); return { steps: ['×4 — удвой два раза', `${n} + ${n} = ${2 * n}`, `${2 * n} + ${2 * n} = ${p}`, fin], guide: [`Удвой ${n}: ${n} + ${n} = ${2 * n}`, `Удвой ещё раз: ${2 * n} + ${2 * n} = ?`], short: `удвой ${n} два раза`, nudge: '×4 — удвой два раза' }; }
  const mn = Math.min(a, b), mx = Math.max(a, b);
  if (mx <= 5) {
    return { steps: [`Вспомни ${a} × ${b - 1} = ${a * (b - 1)}`, `Добавь ещё ${a}`, `${a * (b - 1)} + ${a} = ${p}`, fin], guide: [`${a} × ${b - 1} = ${a * (b - 1)}`, `Добавь ещё ${a}: ${a * (b - 1)} + ${a} = ?`], short: `${a} × ${b - 1} + ${a}`, nudge: `Вспомни ${a} × ${b - 1}` };
  }
  let x, y;
  if (mn > 5) { x = mn; y = mx; } else { x = mx; y = mn; }
  const r = x - 5, f1 = 5 * y, f2 = r * y;
  return {
    steps: [`Разложим ${x} на 5 и ${r}`, `Вспомни 5 × ${y} = ${f1}`, `Осталось ещё ${r} × ${y} = ${f2}`, `${f1} + ${f2} = ${p}`, fin],
    guide: [`Разложим ${x} = 5 + ${r}`, `5 × ${y} = ${f1}, а ${r} × ${y} = ${f2}`, `Сложи: ${f1} + ${f2} = ?`],
    short: `5 × ${y} + ${r} × ${y}`, nudge: `Вспомни 5 × ${y}`,
    split: { alongRows: x === b, f1, f2 }
  };
}
function mnemonicFor(a, b) {
  const k = key(a, b); if (MNEMO[k]) return MNEMO[k];
  const p = a * b, has = n => a === n || b === n, oth = n => (a === n ? b : a);
  if (has(1)) return { i: '🪞', t: `Умножить на 1 — число остаётся само собой: ${p}.` };
  if (has(10)) return { i: '0️⃣', t: `Умножить на 10 — допиши к числу ноль: ${oth(10)} → ${p}.` };
  if (has(9)) { const n = oth(9); return { i: '9️⃣', t: `Хитрость девятки: десятков на 1 меньше, чем ${n}, — это ${n - 1}. А ${n - 1} + ${10 - n} = 9. Значит ${p}!` }; }
  if (has(5)) { const n = oth(5); return { i: '🖐️', t: `С пятёркой ответ всегда кончается на 0 или 5. ${n} × 10 = ${n * 10}, а половина — ${p}.` }; }
  if (has(2)) { const n = oth(2); return { i: '👯', t: `×2 — это близнецы: ${n} и ещё ${n}. Вместе ${p}.` }; }
  if (has(4)) { const n = oth(4); return { i: '✌️', t: `×4 — удвой два раза: ${n} → ${2 * n} → ${p}.` }; }
  if (a === b) return { i: '🟪', t: `${a} × ${a} — это квадрат: ${a} рядов по ${a}. Всего ${p} клеточек.` };
  return { i: '🧩', t: `Разложи: ${strategy(a, b).short} = ${p}.` };
}

/* =====================================================================
   6. ВИЗУАЛЬНЫЕ ПРЕДСТАВЛЕНИЯ
   ===================================================================== */
function dotsHTML(a, b, split) {
  const ds = (a > 8 || b > 8) ? 14 : 18;
  let h = `<div class="dots-grid" style="grid-template-columns:repeat(${a},var(--ds));--ds:${ds}px">`;
  for (let r = 0; r < b; r++) for (let c = 0; c < a; c++) {
    let cls = '';
    if (split) cls = (split.alongRows ? r : c) < 5 ? '' : 'd2';
    h += `<span class="dot ${cls}" style="animation-delay:${(r * a + c) * 6}ms"></span>`;
  }
  h += '</div>';
  if (split) h += `<div class="legend"><span><i class="lg"></i>${split.f1}</span><span><i class="lg d2"></i>${split.f2}</span></div>`;
  return h;
}
function memoHTML(m, alt) { return `<div class="memo ${alt ? 'alt' : ''}"><span class="mi">${m.i}</span><div>${m.t}</div></div>`; }
function tabBody(a, b, tab) {
  const p = a * b;
  if (tab === 'look') {
    const it = itemFor(a + b); let rows = '';
    for (let r = 1; r <= b; r++) rows += `<div class="erow" style="animation-delay:${r * 60}ms"><span class="items">${it.repeat(a)}</span><span class="sum">${a * r}</span></div>`;
    return `<p class="lead">${b} ${plural(b, ['группа', 'группы', 'групп'])} по ${a} ${plural(a, ['предмету', 'предмета', 'предметов'])}</p>
      <div class="erows" style="--es:${a > 7 ? '1.05rem' : '1.35rem'}">${rows}</div>
      <p class="muted">Справа — сколько уже насчитали. Последнее число и есть ответ: <b>${p}</b></p>`;
  }
  if (tab === 'add') {
    return `<p class="lead">Умножение — это когда одно и то же число складывают несколько раз</p>
      <div class="addline">${Array(b).fill(a).join(' + ')} = <b>${p}</b></div>
      <p class="muted">${b} раз по ${a}. Шагаем по ${a}:</p>
      <div class="skip">${Array.from({ length: b }, (_, i) => `<span style="animation-delay:${i * 80}ms">${a * (i + 1)}</span>`).join('<i>→</i>')}</div>`;
  }
  if (tab === 'split') {

    prompt: `<div class="qtitle">Какое число спряталось?</div><div class="eq">${hideFirst ? '<span class="qm">?</span>' : a} × ${hideFirst ? b : '<span class="qm">?</span>'} = ${p}</div>`,
    options: shuffle([...opts]).map(v => ({ label: String(v), value: v })), correct: ans,
    hints: [`Шагай по ${known}: ${known}, ${known * 2}, ${known * 3}…`, `${cnt.join(', ')} — вот и ${p}!`, `Получилось ${ans} ${plural(ans, ['шаг', 'шага', 'шагов'])}`, `Значит ${a} × ${b} = ${p}, спряталось число ${ans}!`],
    guide: [`Шагай по ${known}: ${known}, ${known * 2}, ${known * 3}…`, `Сколько шагов нужно, чтобы дойти до ${p}?`],

    : [`Каждая строчка больше предыдущей на ${a}`, `${a} × ${b + 1} = ${a * (b + 1)}`, `${a * (b + 1)} − ${a} = ${p}`, `Значит ${a} × ${b} = ${p}!`];

    q.done = true;
    btn.classList.add('right');
    $$('.opt').forEach(b => b.disabled = true);
    const hb = $('#hardBtn'); if (hb) hb.remove();
    const outcome = q.hadWrong ? 'retry' : (q.usedHint ? 'hint' : 'first');
    const gained = applyCorrect(q.fa, q.fb, outcome);
    round.stars += gained;
    if (outcome === 'first' && !q.isFollow) round.okFirst++;
    if (outcome === 'first') confetti();
    SND.ok();
    mascotMood('happy', outcome === 'first' ? pick(PRAISE) : pick(RETRY_PRAISE));
    showCorrectFeedback(q, gained);
  } else {
    btn.classList.add('tried'); btn.disabled = true;
    q.attempts++;
    if (!q.hadWrong) {
      q.hadWrong = true;
      applyWrong(q.fa, q.fb);
      round.missed.set(key(q.fa, q.fb), [q.fa, q.fb]);
      if (round.kind === 'training') reinsert(q);
    }
    SND.oops();
    mascotMood('support', pick(SUPPORT));
    showWrongFeedback(q);
  }
  checkAchievements();
}
function reinsert(q) {
  const it = q.item; if (!it || it.re) return;
  const pos = Math.min(round.items.length, round.qi + 3);
  round.items.splice(pos, 0, { kind: 'ask', a: q.fb, b: q.fa, mode: 'choice', re: true });
}
function showWrongFeedback(q) {
  const fb = $('#feedback');
  if (fb.dataset.shown) return;
  fb.dataset.shown = '1';
  const guide = q.guide || strategy(q.fa, q.fb).guide;
  const st = strategy(q.fa, q.fb);
  const visual = q.noVisual ? '' : `<p>Представь ${q.fb} ${plural(q.fb, ['ряд', 'ряда', 'рядов'])} по ${q.fa}:</p>${dotsHTML(q.fa, q.fb, st.split)}`;
  fb.innerHTML = `<div class="fb soft">
    <h3>Давай разберём 🔍</h3>
    ${guide.map((g, i) => `<div class="hstep" style="animation-delay:${i * 140}ms">💡 ${g}</div>`).join('')}
    ${visual}

  </div>`;
}
function showCorrectFeedback(q, gained) {
  const a = q.fa, b = q.fb, p = a * b, lv = level(a, b), m = mnemonicFor(a, b);
  let body;
  if (lv >= 4 && !q.hadWrong) {
    body = `<p class="remember">${a} × ${b} = <b>${p}</b> — ты это уже знаешь! 🌟</p>`;
  } else if (lv >= 2 && !q.hadWrong) {
    body = `<p class="remember">Запомни: <b>${a} × ${b} = ${p}</b></p>${memoHTML(m)}`;
  } else {
    body = `<p class="remember">Запомни: <b>${a} × ${b} = ${p}</b>${a !== b ? `<br><span class="muted">А ещё: <b>${b} × ${a} = ${p}</b></span>` : ''}</p>
      <p>Это ${b} ${plural(b, ['ряд', 'ряда', 'рядов'])} по ${a} ${plural(a, ['предмету', 'предмета', 'предметов'])}:</p>
      ${dotsHTML(a, b)}${memoHTML(m)}`;
  }
  const follow = q.followUp && !q.isFollow;
  $('#feedback').innerHTML = `<div class="fb good">
    <h3>${gained ? '+' + gained + ' ⭐' : ''}</h3>
    ${q.correctNote ? `<p>${q.correctNote}</p>` : ''}
    ${body}
    <div class="row-btns">${follow
      ? '<button class="btn" data-act="follow">Найти правильный ответ →</button>'
      : '<button class="btn" data-act="next">Дальше →</button>'}</div>
  </div>`;
  $('#feedback').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function nextStep() {

function blitzAnswer(i) {
  if (!blitz || blitz.lock) return;
  const q = blitz.q, o = q.options[i], btn = $(`.opt[data-i="${i}"]`);
  blitz.lock = true;
  if (o.value === q.correct) {

    $('#blitzFb').innerHTML = `<span class="flash-ok">${pick(['Да! ⭐', 'Верно! ✨', 'Класс! 🚀'])}</span>`;
    setTimeout(() => { if (blitz) { blitz.lock = false; blitzNext(); } }, 380);
  } else {
    blitz.wrong++; btn.classList.add('tried');
    $$('.opt').forEach(b => { if (+b.textContent === q.correct) b.classList.add('show'); });

}

      <span><b style="background:var(--mint-s)"></b>почти знаю</span>
      <span><b style="background:var(--coral-s)"></b>тренируем 🌱</span>
      <span><b style="background:var(--sky-s)"></b>встречалось</span>
      <span><b style="background:#fff;box-shadow:inset 0 0 0 1px #ddd"></b>ещё впереди</span>
    </div>
    <div class="card ginfo" id="ginfo"><p class="muted" style="font-size:1.1rem">Здесь появится пример 👆</p></div>
  </div>`;
}
function selectCell(r, c) {
  $$('.cell').forEach(x => {
    const xr = +x.dataset.r, xc = +x.dataset.c;
    x.classList.toggle('hl', (xr === r && xc <= c) || (xc === c && xr <= r));
    x.classList.toggle('sel', xr === r && xc === c);
  });
  $$('.gh[data-hr]').forEach(x => x.classList.toggle('hl', +x.dataset.hr === r));
  $$('.gh[data-hc]').forEach(x => x.classList.toggle('hl', +x.dataset.hc === c));
  const m = mnemonicFor(r, c), cls = cellClass(r, c);
  const note = { mastered: 'Ты это уже освоил! 🌟', good: 'Почти выучено 🙂', growing: 'Этот пример мы ещё тренируем 🌱', seen: 'Уже встречался', easy: 'Самый лёгкий пример 😊', '': 'Этот пример ещё впереди ✨' }[cls];
  $('#ginfo').innerHTML = `<div class="big">${r} × ${c} = ${r * c}</div><p class="muted">${note}</p>${memoHTML(m)}
    ${r > 1 && c > 1 ? `<button class="btn small" data-fact="${c},${r}">🔍 Разобрать</button>` : ''}`;
}
function renderProfile() {
  const lvl = playerLevel(), into = S.stars % 30;
  const weak = weakFacts(8);
  app.innerHTML = `<div class="screen">${back()}
    <h1 class="h1">🏆 Мои успехи</h1>
    <div class="stats">
      <div class="stat"><div class="v">⭐ ${S.stars}</div><div class="l">звёзд</div></div>
      <div class="stat"><div class="v">🪙 ${S.coins}</div><div class="l">монеток</div></div>
      <div class="stat"><div class="v">🏆 ${lvl}</div><div class="l">уровень</div><div class="bar"><i style="width:${into / 30 * 100}%"></i></div></div>
      <div class="stat"><div class="v">🔥 ${S.streak}</div><div class="l">серия (рекорд ${S.best})</div></div>
      <div class="stat"><div class="v">📚 ${learnedPct()}%</div><div class="l">таблицы изучено</div></div>
    </div>
    <h2 class="sec">Мои таблицы</h2>
    <div class="trows">${TABLES.map(n => `<button class="trow" data-go="learn:${n}"><span class="n">×${n}</span>${starsStr(tableStars(n))}</button>`).join('')}</div>
    ${weak.length ? `<h2 class="sec">🌱 Пока тренируем</h2><div class="card"><p>Это не ошибки, а подсказки, что потренировать:</p>
      <div class="chips">${weak.map(w => `<button class="chip" data-fact="${w.a},${w.b}">${w.a} × ${w.b}</button>`).join('')}</div>
      <button class="btn mint" data-go="training">💪 Потренировать</button></div>` : ''}
    <h2 class="sec">Достижения</h2>
    <div class="achs">${ACH.map(a => `<div class="ach ${S.ach.includes(a.id) ? '' : 'locked'}"><div class="i">${a.i}</div><div class="t">${a.t}</div><div class="d">${a.d}</div></div>`).join('')}</div>
  </div>`;
}

/* ---------- Модальные окна ---------- */
function showModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBody').innerHTML = ''; }
function openExplain(a, b) { showModal(explainHTML(a, b, 'look') + `<div class="row-btns"><button class="btn" data-act="close">Понятно 👍</button></div>`); }
function openSettings() {
  showModal(`<h2>⚙️ Настройки</h2>
    <div class="set-row"><span>🔊 Звуки</span><button class="btn small ${S.sound ? 'mint' : 'ghost'}" data-act="sound">${S.sound ? 'Включены' : 'Выключены'}</button></div>
    <div class="set-row"><span>🗑️ Прогресс</span><button class="btn small coral" data-act="reset">Сбросить прогресс</button></div>
    <div id="resetConfirm"></div>`);
}

/* =====================================================================
   12. НАВИГАЦИЯ И СОБЫТИЯ
   ===================================================================== */
function go(route) {
  stopBlitz(); closeModal();
  const [r, x] = route.split(':');
  window.scrollTo({ top: 0 });
  switch (r) {
    case 'home': round = null; renderHome(); break;
    case 'learn': x ? renderLearnTable(+x) : renderLearnPick(); break;
    case 'hard': renderHard(); break;
    case 'daily': startRound({ mode: 'daily', title: 'Тренировка дня', icon: '🌟', count: 10 }); break;
    case 'round': {
      const y = route.split(':')[2];
      startRound({ mode: x, table: y && y !== 'hard' ? +y : null, hard: y === 'hard', title: y === 'hard' ? 'Трудные пары' : (y ? `${MODES[x].title}: ×${y}` : null) });
      break;
    }
    case 'training': startTraining(); break;
    case 'blitz': renderBlitzIntro(); break;
    case 'tricks': renderTricks(); break;
    case 'grid': renderGrid(); break;
    case 'profile': renderProfile(); break;
    default: renderHome();
  }
}
const actions = {
  hard: hardHint,
  next: nextStep,
  follow: () => { round.q = round.q.followUp(); renderQuestion(); },
  again: () => { if (round.kind === 'training') startTraining(); else startRound(round.cfg); },
  'blitz-start': startBlitz,
  close: closeModal,
  backdrop: (t, e) => { if (e.target === t) closeModal(); },
  settings: openSettings,
  sound: () => {
    S.sound = !S.sound; save(); updateTop();
    if (S.sound) SND.ok();
    if (!$('#modal').classList.contains('hidden') && $('#resetConfirm')) openSettings();
  },
  reset: () => {
    $('#resetConfirm').innerHTML = `<div class="confirm"><p>Точно сбросить? Все звёзды, монетки и успехи пропадут.</p>
      <div class="row-btns"><button class="btn coral small" data-act="reset-yes">Да, сбросить</button><button class="btn ghost small" data-act="reset-no">Нет, оставить</button></div></div>`;
  },
  'reset-no': () => { $('#resetConfirm').innerHTML = ''; },
  'reset-yes': () => {
    const snd = S.sound; S = defaultState(); S.sound = snd; save(); updateTop();
    go('home'); toast('Прогресс сброшен. Начинаем сначала! 🌱');
  },
  finger: t => { $$('.fbtns button').forEach(b => b.classList.toggle('on', b === t)); $('#fingers').innerHTML = fingersHTML(+t.dataset.n); },
  rotate: () => {
    const r = $('#rot'); r.classList.toggle('turned');
    $('#rotLabel').innerHTML = r.classList.contains('turned') ? '<b>3 × 7 = 21</b> — точек столько же!' : '<b>7 × 3 = 21</b>';
  },
  cell: t => selectCell(+t.dataset.r, +t.dataset.c),
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-fact],[data-tab],[data-ex],[data-hp],[data-act],.opt');
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.fact) { const [a, b] = t.dataset.fact.split(',').map(Number); return openExplain(a, b); }
  if (t.dataset.tab) return switchTab(t.closest('.explain'), t.dataset.tab);
  if (t.dataset.ex) {
    const [n, m] = t.dataset.ex.split(',').map(Number);
    $$('.ex-row').forEach(x => x.classList.toggle('on', x === t));
    $('#exPanel').innerHTML = explainHTML(n, m);
    if (window.innerWidth < 720) $('#exPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (t.dataset.hp) {
    const [a, b] = HARD_PAIRS[+t.dataset.hp];
    $$('[data-hp]').forEach(x => x.classList.toggle('on', x === t));
    $('#exPanel').innerHTML = explainHTML(a, b);
    return;
  }
  if (t.classList.contains('opt')) { const i = +t.dataset.i; return blitz ? blitzAnswer(i) : answer(i); }
  if (t.dataset.act && actions[t.dataset.act]) actions[t.dataset.act](t, e);
});
// Клавиши 1–4 выбирают ответ, Escape закрывает окно
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeModal();
  if (/^[1-4]$/.test(e.key)) {
    const opts = $$('#app .opt');
    const b = opts[+e.key - 1]; if (b && !b.disabled) b.click();
  }
});

/* =====================================================================
   13. ЗАПУСК
   ===================================================================== */
updateTop();
renderHome();
</script>
</body>
</html>
